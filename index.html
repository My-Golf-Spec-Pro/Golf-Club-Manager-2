<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f4f6f5;
    color: #222;
}

/* =========================
   ヘッダー
========================= */

header {
    background: #126b3a;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 6px 0 0;
    opacity: .85;
}

/* =========================
   全体
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

/* =========================
   ツールバー
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

input,
select,
textarea,
button {
    font: inherit;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
}

.search {
    flex: 1;
    min-width: 220px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
}

.primary {
    background: #126b3a;
    color: white;
}

.secondary {
    background: #e5e9e7;
    color: #222;
}

.danger {
    background: #d9363e;
    color: white;
}

/* =========================
   クラブ一覧
========================= */

.club-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

.club-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .15s;
}

.club-card:active {
    transform: scale(.98);
}

.club-photo {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #e9eceb;
}

.no-photo {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9eceb;
    color: #777;
    font-size: 50px;
}

.card-body {
    padding: 16px;
}

.club-type {
    color: #126b3a;
    font-size: 25px;
    font-weight: 800;
}

.maker {
    color: #777;
    margin-top: 4px;
}

.name {
    font-size: 19px;
    font-weight: 700;
    margin: 5px 0 14px;
}

.distance {
    display: flex;
    gap: 8px;
}

.distance-box {
    flex: 1;
    background: #edf7f1;
    padding: 10px;
    border-radius: 10px;
}

.distance-box small {
    color: #777;
}

.distance-box strong {
    display: block;
    margin-top: 3px;
}

/* 一覧では主要情報だけ表示 */

.tap-detail {
    margin-top: 14px;
    padding: 10px;
    border-radius: 9px;
    background: #f1f4f3;
    text-align: center;
    color: #126b3a;
    font-weight: 600;
}

/* =========================
   詳細画面
========================= */

.detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 20;
    overflow-y: auto;
    padding: 12px;
}

.detail-content {
    max-width: 800px;
    margin: 10px auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
}

.detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: white;
    z-index: 2;
}

.detail-header h2 {
    margin: 0;
    font-size: 21px;
}

.detail-edit {
    background: #126b3a;
    color: white;
    padding: 9px 14px;
}

.detail-close {
    background: #e5e9e7;
    padding: 9px 14px;
}

.detail-main {
    padding: 18px;
}

.detail-photo {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 14px;
    background: #eef0ef;
    display: block;
    margin-bottom: 20px;
}

.detail-no-photo {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef0ef;
    border-radius: 14px;
    font-size: 70px;
    color: #777;
    margin-bottom: 20px;
}

.detail-type {
    font-size: 36px;
    font-weight: 800;
    color: #126b3a;
}

.detail-maker {
    font-size: 17px;
    color: #777;
    margin-top: 4px;
}

.detail-name {
    font-size: 25px;
    font-weight: 700;
    margin-top: 5px;
}

.detail-distance {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.detail-distance-box {
    background: #edf7f1;
    padding: 16px;
    border-radius: 12px;
}

.detail-distance-box small {
    color: #777;
}

.detail-distance-box strong {
    display: block;
    font-size: 24px;
    margin-top: 4px;
}

/* =========================
   詳細スペック
========================= */

.detail-section {
    margin-top: 24px;
}

.detail-section h3 {
    margin: 0 0 10px;
    font-size: 18px;
    border-left: 5px solid #126b3a;
    padding-left: 10px;
}

.detail-specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.detail-spec {
    background: #f5f6f6;
    padding: 11px;
    border-radius: 9px;
}

.detail-spec small {
    display: block;
    color: #777;
    font-size: 11px;
    margin-bottom: 3px;
}

.detail-spec strong {
    font-size: 15px;
    word-break: break-word;
}

.detail-memo {
    white-space: pre-wrap;
    background: #f5f6f6;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.6;
}

/* =========================
   編集画面
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 30;
    overflow-y: auto;
    padding: 20px;
}

.modal-content {
    max-width: 700px;
    margin: 30px auto;
    background: white;
    border-radius: 18px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
}

.full {
    grid-column: 1 / -1;
}

.preview {
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 10px;
}

.modal-actions {
    margin-top: 25px;
}

/* 保存・キャンセル */

.save-row {
    display: flex;
    gap: 10px;
}

.save-row button {
    flex: 1;
}

/* 削除は一番下 */

.delete-area {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}

.delete-area p {
    color: #888;
    font-size: 12px;
    margin: 0 0 8px;
}

.delete-button-bottom {
    width: 100%;
    background: #d9363e;
    color: white;
}

/* =========================
   空表示
========================= */

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #777;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .modal {
        padding: 8px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 16px;
    }

    header h1 {
        font-size: 22px;
    }

    .detail-modal {
        padding: 6px;
    }

    .detail-content {
        margin: 4px auto;
    }

    .detail-main {
        padding: 14px;
    }

    .detail-type {
        font-size: 32px;
    }

    .detail-name {
        font-size: 22px;
    }

    .detail-distance {
        grid-template-columns: 1fr 1fr;
    }

    .detail-specs {
        grid-template-columns: 1fr 1fr;
    }

    .detail-header h2 {
        font-size: 18px;
    }

    .detail-edit,
    .detail-close {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>

<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 番手・メーカー・商品名を検索"
        >

        <button class="primary" onclick="openAddModal()">
            ＋ クラブを追加
        </button>

    </div>

    <div id="clubGrid" class="club-grid"></div>

</div>


<!-- =========================
     詳細画面
========================= -->

<div id="detailModal" class="detail-modal">

    <div class="detail-content">

        <div class="detail-header">

            <button
                class="detail-close"
                onclick="closeDetail()"
            >
                ← 戻る
            </button>

            <h2>クラブ詳細</h2>

            <button
                id="detailEditButton"
                class="detail-edit"
                onclick="editFromDetail()"
            >
                編集
            </button>

        </div>

        <div
            id="detailMain"
            class="detail-main"
        ></div>

    </div>

</div>


<!-- =========================
     編集・追加画面
========================= -->

<div id="modal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">新しいクラブ</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>番手</label>

                <select id="clubType">
                    <option>1W</option>
                    <option>2W</option>
                    <option>3W</option>
                    <option>4W</option>
                    <option>5W</option>
                    <option>7W</option>
                    <option>9W</option>
                    <option>2U</option>
                    <option>3U</option>
                    <option>4U</option>
                    <option>5U</option>
                    <option>6U</option>
                    <option>1I</option>
                    <option>2I</option>
                    <option>3I</option>
                    <option>4I</option>
                    <option>5I</option>
                    <option>6I</option>
                    <option>7I</option>
                    <option>8I</option>
                    <option>9I</option>
                    <option>PW</option>
                    <option>AW</option>
                    <option>SW</option>
                    <option>LW</option>
                    <option>チッパー</option>
                    <option>パター</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>メーカー</label>
                <input
                    id="maker"
                    placeholder="例：TaylorMade"
                >
            </div>

            <div class="form-group full">
                <label>商品名</label>
                <input
                    id="name"
                    placeholder="例：Qi35"
                >
            </div>

            <div class="form-group">
                <label>総飛距離</label>
                <input
                    id="distance"
                    placeholder="例：230 yd"
                >
            </div>

            <div class="form-group">
                <label>キャリー</label>
                <input
                    id="carry"
                    placeholder="例：210 yd"
                >
            </div>

            <div class="form-group">
                <label>クラブ重量</label>
                <input
                    id="clubWeight"
                    placeholder="例：300 g"
                >
            </div>

            <div class="form-group">
                <label>クラブ長さ</label>
                <input
                    id="clubLength"
                    placeholder="例：45.5 inch"
                >
            </div>

            <div class="form-group">
                <label>ロフト角</label>
                <input
                    id="loft"
                    placeholder="例：10.5°"
                >
            </div>

            <div class="form-group">
                <label>ライ角</label>
                <input
                    id="lieAngle"
                    placeholder="例：60°"
                >
            </div>

            <div class="form-group">
                <label>バンス角</label>
                <input
                    id="bounce"
                    placeholder="例：10°"
                >
            </div>

            <div class="form-group">
                <label>シャフト名</label>
                <input
                    id="shaft"
                    placeholder="例：VENTUS TR"
                >
            </div>

            <div class="form-group">
                <label>フレックス</label>

                <select id="flex">
                    <option>R2</option>
                    <option>R</option>
                    <option>SR</option>
                    <option selected>S</option>
                    <option>SX</option>
                    <option>X</option>
                    <option>TX</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>シャフト重量</label>
                <input
                    id="shaftWeight"
                    placeholder="例：60 g"
                >
            </div>

            <div class="form-group">
                <label>シャフト長さ</label>
                <input
                    id="shaftLength"
                    placeholder="例：44.0 inch"
                >
            </div>

            <div class="form-group">
                <label>キックポイント</label>

                <select id="kickPoint">
                    <option>元調子</option>
                    <option>中元調子</option>
                    <option selected>中調子</option>
                    <option>先中調子</option>
                    <option>先調子</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>グリップ交換日</label>

                <input
                    id="gripDate"
                    type="date"
                >
            </div>

            <div class="form-group full">

                <label>クラブ写真</label>

                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >

                <img
                    id="preview"
                    class="preview"
                    style="display:none;"
                >

            </div>

            <div class="form-group full">

                <label>メモ</label>

                <textarea
                    id="memo"
                    rows="5"
                    placeholder="クラブについてのメモ"
                ></textarea>

            </div>

        </div>


        <!-- 保存・キャンセル -->

        <div class="modal-actions">

            <div class="save-row">

                <button
                    class="secondary"
                    onclick="closeModal()"
                >
                    キャンセル
                </button>

                <button
                    class="primary"
                    onclick="saveClub()"
                >
                    保存
                </button>

            </div>


            <!-- 削除は一番下 -->

            <div
                id="deleteArea"
                class="delete-area"
                style="display:none;"
            >

                <p>
                    このクラブを完全に削除します。
                </p>

                <button
                    class="delete-button-bottom"
                    onclick="deleteCurrentClub()"
                >
                    🗑️ このクラブを削除
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let clubs = [];

let editingId = null;

let currentPhoto = null;

let detailId = null;

const STORAGE_KEY = "golfClubManagerData";


/* =========================
   データ読み込み
========================= */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            clubs = JSON.parse(saved);

        } catch {

            clubs = [];

        }

    }

    renderClubs();
}


/* =========================
   データ保存
========================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}


/* =========================
   一覧表示
========================= */

function renderClubs() {

    const grid =
        document.getElementById("clubGrid");

    const keyword =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        clubs.filter(club => {

            const text = [

                club.clubType,
                club.maker,
                club.name,
                club.shaft

            ].join(" ").toLowerCase();

            return text.includes(keyword);

        });


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">

                <div style="font-size:50px;">
                    ⛳
                </div>

                <h2>
                    クラブがありません
                </h2>

                <p>
                    「＋ クラブを追加」から登録できます。
                </p>

            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(club => {

            const photo =
                club.photo

                ? `<img
                    class="club-photo"
                    src="${club.photo}"
                  >`

                : `<div class="no-photo">
                    ⛳
                  </div>`;


            return `

                <div
                    class="club-card"
                    onclick="openDetail('${club.id}')"
                >

                    ${photo}

                    <div class="card-body">

                        <div class="club-type">
                            ${escapeHTML(
                                club.clubType || "未設定"
                            )}
                        </div>

                        <div class="maker">
                            ${escapeHTML(
                                club.maker ||
                                "メーカー未入力"
                            )}
                        </div>

                        <div class="name">
                            ${escapeHTML(
                                club.name ||
                                "商品名未入力"
                            )}
                        </div>


                        <div class="distance">

                            <div class="distance-box">

                                <small>
                                    総飛距離
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        club.distance || "-"
                                    )}
                                </strong>

                            </div>


                            <div class="distance-box">

                                <small>
                                    キャリー
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        club.carry || "-"
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div class="tap-detail">
                            タップして詳細を見る →
                        </div>

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================
   詳細画面
========================= */

function openDetail(id) {

    const club =
        clubs.find(c => c.id === id);

    if (!club) return;

    detailId = id;


    const photo =
        club.photo

        ? `<img
            class="detail-photo"
            src="${club.photo}"
          >`

        : `<div class="detail-no-photo">
            ⛳
          </div>`;


    document.getElementById("detailMain")
        .innerHTML = `

        ${photo}

        <div class="detail-type">
            ${escapeHTML(
                club.clubType || "未設定"
            )}
        </div>

        <div class="detail-maker">
            ${escapeHTML(
                club.maker ||
                "メーカー未入力"
            )}
        </div>

        <div class="detail-name">
            ${escapeHTML(
                club.name ||
                "商品名未入力"
            )}
        </div>


        <div class="detail-distance">

            <div class="detail-distance-box">

                <small>
                    総飛距離
                </small>

                <strong>
                    ${escapeHTML(
                        club.distance || "-"
                    )}
                </strong>

            </div>


            <div class="detail-distance-box">

                <small>
                    キャリー
                </small>

                <strong>
                    ${escapeHTML(
                        club.carry || "-"
                    )}
                </strong>

            </div>

        </div>


        <div class="detail-section">

            <h3>
                クラブ情報
            </h3>

            <div class="detail-specs">

                ${detailSpec(
                    "クラブ重量",
                    club.clubWeight
                )}

                ${detailSpec(
                    "クラブ長さ",
                    club.clubLength
                )}

                ${detailSpec(
                    "ロフト角",
                    club.loft
                )}

                ${detailSpec(
                    "ライ角",
                    club.lieAngle
                )}

                ${detailSpec(
                    "バンス角",
                    club.bounce
                )}

            </div>

        </div>


        <div class="detail-section">

            <h3>
                シャフト
            </h3>

            <div class="detail-specs">

                ${detailSpec(
                    "シャフト名",
                    club.shaft
                )}

                ${detailSpec(
                    "フレックス",
                    club.flex
                )}

                ${detailSpec(
                    "シャフト重量",
                    club.shaftWeight
                )}

                ${detailSpec(
                    "シャフト長さ",
                    club.shaftLength
                )}

                ${detailSpec(
                    "キックポイント",
                    club.kickPoint
                )}

            </div>

        </div>


        <div class="detail-section">

            <h3>
                グリップ
            </h3>

            <div class="detail-specs">

                ${detailSpec(
                    "グリップ交換日",
                    club.gripDate
                )}

            </div>

        </div>


        ${
            club.memo

            ? `

                <div class="detail-section">

                    <h3>
                        メモ
                    </h3>

                    <div class="detail-memo">
                        ${escapeHTML(club.memo)}
                    </div>

                </div>

              `

            : ""
        }

        `;


    document.getElementById("detailModal")
        .style.display = "block";
}


function detailSpec(title, value) {

    return `

        <div class="detail-spec">

            <small>
                ${title}
            </small>

            <strong>
                ${escapeHTML(value || "-")}
            </strong>

        </div>

    `;
}


/* =========================
   詳細画面から編集
========================= */

function editFromDetail() {

    if (!detailId) return;

    const id = detailId;

    closeDetail();

    openEditModal(id);
}


/* =========================
   詳細画面を閉じる
========================= */

function closeDetail() {

    document.getElementById("detailModal")
        .style.display = "none";

    detailId = null;
}


/* =========================
   追加
========================= */

function openAddModal() {

    editingId = null;

    currentPhoto = null;

    document.getElementById("modalTitle")
        .textContent =
        "新しいクラブ";

    document.getElementById("deleteArea")
        .style.display = "none";

    clearForm();

    document.getElementById("modal")
        .style.display = "block";
}


/* =========================
   編集
========================= */

function openEditModal(id) {

    const club =
        clubs.find(c => c.id === id);

    if (!club) return;


    editingId = id;

    currentPhoto =
        club.photo || null;


    document.getElementById("modalTitle")
        .textContent =
        "クラブを編集";


    document.getElementById("deleteArea")
        .style.display = "block";


    document.getElementById("clubType")
        .value =
        club.clubType || "1W";

    document.getElementById("maker")
        .value =
        club.maker || "";

/* =========================

========================= */

function saveClub() {

    const data = {

        clubType:
            document.getElementById(
                "clubType"
            ).value,

        maker:
            document.getElementById(
                "maker"
            ).value,

        name:
            document.getElementById(
                "name"
            ).value,

        distance:
            document.getElementById(
                "distance"
            ).value,

        carry:
            document.getElementById(
                "carry"
            ).value,

        clubWeight:
            document.getElementById(
                "clubWeight"
            ).value,

        clubLength:
            document.getElementById(
                "clubLength"
            ).value,

        loft:
            document.getElementById(
                "loft"
            ).value,

        lieAngle:
            document.getElementById(
                "lieAngle"
            ).value,

        bounce:
            document.getElementById(
                "bounce"
            ).value,

        shaft:
            document.getElementById(
                "shaft"
            ).value,

        flex:
            document.getElementById(
                "flex"
            ).value,

        shaftWeight:
            document.getElementById(
                "shaftWeight"
            ).value,

        shaftLength:
            document.getElementById(
                "shaftLength"
            ).value,

        kickPoint:
            document.getElementById(
                "kickPoint"
            ).value,

        gripDate:
            document.getElementById(
                "gripDate"
            ).value,

        memo:
            document.getElementById(
                "memo"
            ).value,

        photo:
            currentPhoto

    };


    /* 編集 */

    if (editingId) {

        const index =
            clubs.findIndex(
                c => c.id === editingId
            );


        if (index !== -1) {

            clubs[index] = {

                ...clubs[index],

                ...data

            };

        }

    }


    /* 新規 */

    else {

        clubs.push({

            id:
                Date.now().toString(),

            ...data

        });

    }


    saveData();

    renderClubs();

    closeModal();
}


/* =========================
   写真
========================= */

document.getElementById("photo")
.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                currentPhoto =
                    e.target.result;


                const preview =
                    document.getElementById(
                        "preview"
                    );


                preview.src =
                    currentPhoto;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================
   削除
========================= */

function deleteCurrentClub() {

    if (!editingId) return;


    const club =
        clubs.find(
            c => c.id === editingId
        );


    if (!club) return;


    const clubName =
        club.clubType +
        " " +
        (club.maker || "") +
        " " +
        (club.name || "");


    const confirmed =
        confirm(
            "このクラブを削除しますか？\n\n" +
            clubName +
            "\n\nこの操作は元に戻せません。"
        );


    if (!confirmed) {

        return;

    }


    clubs =
        clubs.filter(
            club =>
                club.id !== editingId
        );


    saveData();

    renderClubs();

    closeModal();
}


/* =========================
   モーダル閉じる
========================= */

function closeModal() {

    document.getElementById("modal")
        .style.display = "none";

    editingId = null;

    currentPhoto = null;
}

);


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}
