<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f4f6f5;
    color: #222;
}
header {
    background: #126b3a;
    color: white;
    padding: 14px 18px;
}
header h1 {
    margin: 0;
    font-size: 21px;
}
header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: .85;
}
.container {
    max-width: 1200px;
    margin: auto;
    padding: 12px;
}
.toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}
.search {
    flex: 1;
}
input,
select,
textarea,
button {
    font: inherit;
}
input,
select,
textarea {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
}
button {
    border: 0;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
}
.primary {
    background: #126b3a;
    color: white;
}
.secondary {
    background: #e5e9e7;
}
.danger {
    background: #d9363e;
    color: white;
}
/* =========================
   一覧
========================= */
.club-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}
.club-card {
    background: white;
    border-radius: 11px;
    overflow: hidden;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .12s;
}
.club-card:active {
    transform: scale(.97);
}
.club-photo {
    width: 100%;
    height: 105px;
    object-fit: cover;
    background: #e9eceb;
}
.no-photo {
    height: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9eceb;
    color: #777;
    font-size: 32px;
}
.card-body {
    padding: 9px;
}
.club-type {
    color: #126b3a;
    font-size: 20px;
    font-weight: 800;
}
.maker {
    color: #777;
    font-size: 11px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.name {
    font-size: 13px;
    font-weight: 700;
    margin: 3px 0 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.distance {
    display: flex;
    gap: 4px;
}
.distance-box {
    flex: 1;
    background: #edf7f1;
    padding: 5px;
    border-radius: 6px;
    min-width: 0;
}
.distance-box small {
    display: block;
    color: #777;
    font-size: 9px;
}
.distance-box strong {
    display: block;
    margin-top: 2px;
    font-size: 12px;
}
.empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
}
/* =========================
   詳細画面
========================= */
.detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.48);
    z-index: 20;
    overflow-y: auto;
    padding: 12px;
}
.detail-content {
    max-width: 650px;
    margin: 10px auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
}
.detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 17px;
    border-bottom: 1px solid #eee;
}
.detail-header h2 {
    margin: 0;
    font-size: 21px;
}
.detail-edit {
    background: #126b3a;
    color: white;
    padding: 8px 13px;
}
.detail-photo {
    width: 100%;
    max-height: 330px;
    object-fit: contain;
    background: #f0f2f1;
}
.detail-body {
    padding: 17px;
}
.detail-title {
    font-size: 30px;
    font-weight: 900;
    color: #126b3a;
}
.detail-maker {
    color: #777;
    margin-top: 3px;
}
.detail-name {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 18px;
}
.big-distance {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 15px;
}
.big-distance-box {
    background: #edf7f1;
    border-radius: 11px;
    padding: 12px;
    text-align: center;
}
.big-distance-box small {
    color: #666;
}
.big-distance-box strong {
    display: block;
    font-size: 21px;
    margin-top: 3px;
}
.detail-specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.detail-spec {
    background: #f5f6f6;
    padding: 10px;
    border-radius: 9px;
}
.detail-spec small {
    display: block;
    color: #777;
    font-size: 11px;
}
.detail-spec strong {
    display: block;
    margin-top: 3px;
}
.detail-memo {
    background: #f5f6f6;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    white-space: pre-wrap;
}
.detail-close {
    margin-top: 15px;
    width: 100%;
}
/* =========================
   編集画面
========================= */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 30;
    overflow-y: auto;
    padding: 10px;
}
.modal-content {
    max-width: 700px;
    margin: 10px auto;
    background: white;
    border-radius: 18px;
    padding: 17px;
}
.modal h2 {
    margin: 0 0 15px;
}
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.form-group {
    margin-bottom: 8px;
}
.form-group label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
}
.full {
    grid-column: 1 / -1;
}
/* =========================
   数字選択
========================= */
.number-display {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 43px;
    background: #f3f5f4;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 19px;
    font-weight: 700;
}
.number-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 7px;
}
.number-buttons button {
    background: #e9edeb;
    padding: 10px 4px;
    font-weight: 600;
}
.number-buttons button:active {
    background: #cfd8d3;
}
.preset-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin-top: 7px;
    max-height: 170px;
    overflow-y: auto;
}
.preset-buttons button {
    background: #e9edeb;
    padding: 8px 3px;
    font-size: 12px;
}
.selected-number {
    background: #126b3a !important;
    color: white;
}
.preview {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 9px;
    margin-top: 8px;
}
.modal-actions {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.save-button {
    background: #126b3a;
    color: white;
    width: 100%;
    font-size: 16px;
    padding: 13px;
}
.cancel-button {
    background: #e5e9e7;
    width: 100%;
}
.delete-edit-button {
    background: #d9363e;
    color: white;
    width: 100%;
    padding: 12px;
    margin-top: 8px;
}
@media (max-width: 900px) {
    .club-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}
@media (max-width: 650px) {
    .club-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
    }
    .club-photo,
    .no-photo {
        height: 85px;
    }
    .card-body {
        padding: 7px;
    }
    .club-type {
        font-size: 18px;
    }
    .maker {
        font-size: 10px;
    }
    .name {
        font-size: 12px;
    }
    .distance-box {
        padding: 4px;
    }
    .distance-box strong {
        font-size: 10px;
    }
    .form-grid {
        grid-template-columns: 1fr;
    }
    .full {
        grid-column: auto;
    }
    .detail-specs {
        grid-template-columns: 1fr 1fr;
    }
}
@media (max-width: 430px) {
    .club-grid {
        grid-template-columns: repeat(3, 1fr);
    }
    .club-photo,
    .no-photo {
        height: 72px;
    }
    .club-type {
        font-size: 16px;
    }
    .detail-title {
        font-size: 27px;
    }
}
</style>
</head>
<body>
<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>
<div class="container">
<div class="toolbar">
    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔍 番手・メーカー・商品名"
    >
    <button class="primary" onclick="openAddModal()">
        ＋ 追加
    </button>
</div>
<div id="clubGrid" class="club-grid"></div>
</div>
<!-- =========================
     詳細画面
========================= -->
<div id="detailModal" class="detail-modal">
<div class="detail-content">
    <div class="detail-header">
        <h2>クラブ詳細</h2>
        <button
            class="detail-edit"
            onclick="editFromDetail()"
        >
            ✏️ 編集
        </button>
    </div>
    <div id="detailBody" class="detail-body"></div>
</div>
</div>
<!-- =========================
     編集画面
========================= -->
<div id="modal" class="modal">
<div class="modal-content">
    <h2 id="modalTitle">新しいクラブ</h2>
    <div class="form-grid">
        <div class="form-group">
            <label>番手</label>
            <select id="clubType">
                <option>1W</option>
                <option>2W</option>
                <option>3W</option>
                <option>4W</option>
                <option>5W</option>
                <option>7W</option>
                <option>9W</option>
                <option>2U</option>
                <option>3U</option>
                <option>4U</option>
                <option>5U</option>
                <option>6U</option>
                <option>1I</option>
                <option>2I</option>
                <option>3I</option>
                <option>4I</option>
                <option>5I</option>
                <option>6I</option>
                <option>7I</option>
                <option>8I</option>
                <option>9I</option>
                <option>PW</option>
                <option>AW</option>
                <option>SW</option>
                <option>LW</option>
                <option>チッパー</option>
                <option>パター</option>
                <option>その他</option>
            </select>
        </div>
        <div class="form-group">
            <label>メーカー</label>
            <input id="maker" placeholder="例：TaylorMade">
        </div>
        <div class="form-group full">
            <label>商品名</label>
            <input id="name" placeholder="例：Qi35">
        </div>
        <!-- 総飛距離 -->
        <div class="form-group">
            <label>総飛距離</label>
            <div id="distanceDisplay" class="number-display">
                未選択
            </div>
            <div id="distanceButtons" class="preset-buttons"></div>
        </div>
        <!-- キャリー -->
        <div class="form-group">
            <label>キャリー</label>
            <div id="carryDisplay" class="number-display">
                未選択
            </div>
            <div id="carryButtons" class="preset-buttons"></div>
        </div>
        <!-- クラブ重量 -->
        <div class="form-group">
            <label>クラブ重量</label>
            <div id="clubWeightDisplay" class="number-display">
                未選択
            </div>
            <div id="clubWeightButtons" class="number-buttons"></div>
        </div>
        <!-- クラブ長さ -->
        <div class="form-group">
            <label>クラブ長さ</label>
            <div id="clubLengthDisplay" class="number-display">
                未選択
            </div>
            <div id="clubLengthButtons" class="number-buttons"></div>
        </div>
        <!-- ロフト -->
        <div class="form-group">
            <label>ロフト角</label>
            <div id="loftDisplay" class="number-display">
                未選択
            </div>
            <div id="loftButtons" class="number-buttons"></div>
        </div>
        <!-- ライ -->
        <div class="form-group">
            <label>ライ角</label>
            <div id="lieAngleDisplay" class="number-display">
                未選択
            </div>
            <div id="lieAngleButtons" class="number-buttons"></div>
        </div>
        <!-- バンス -->
        <div class="form-group">
            <label>バンス角</label>
            <div id="bounceDisplay" class="number-display">
                未選択
            </div>
            <div id="bounceButtons" class="number-buttons"></div>
        </div>
        <div class="form-group">
            <label>シャフト名</label>
            <input id="shaft" placeholder="例：VENTUS TR">
        </div>
        <div class="form-group">
            <label>フレックス</label>
            <select id="flex">
                <option>R2</option>
                <option>R</option>
                <option>SR</option>
                <option selected>S</option>
                <option>SX</option>
                <option>X</option>
                <option>TX</option>
                <option>その他</option>
            </select>
        </div>
        <!-- シャフト重量 -->
        <div class="form-group">
            <label>シャフト重量</label>
            <div id="shaftWeightDisplay" class="number-display">
                未選択
            </div>
            <div id="shaftWeightButtons" class="number-buttons"></div>
        </div>
        <!-- シャフト長さ -->
        <div class="form-group">
            <label>シャフト長さ</label>
            <div id="shaftLengthDisplay" class="number-display">
                未選択
            </div>
            <div id="shaftLengthButtons" class="number-buttons"></div>
        </div>
        <div class="form-group">
            <label>キックポイント</label>
            <select id="kickPoint">
                <option>元調子</option>
                <option>中元調子</option>
                <option selected>中調子</option>
                <option>先中調子</option>
                <option>先調子</option>
                <option>その他</option>
            </select>
        </div>
        <div class="form-group">
            <label>グリップ交換日</label>
            <input id="gripDate" type="date">
        </div>
        <div class="form-group full">
            <label>クラブ写真</label>
            <input
                id="photo"
                type="file"
                accept="image/*"
            >
            <img
                id="preview"
                class="preview"
                style="display:none;"
            >
        </div>
        <div class="form-group full">
            <label>メモ</label>
            <textarea
                id="memo"
                rows="4"
                placeholder="クラブについてのメモ"
            ></textarea>
        </div>
    </div>
    <div class="modal-actions">
        <button
            class="cancel-button"
            onclick="closeModal()"
        >
            キャンセル
        </button>
        <button
            class="save-button"
            onclick="saveClub()"
        >
            保存
        </button>
        <!-- 削除は編集画面の一番下 -->
        <button
            id="deleteButton"
            class="delete-edit-button"
            onclick="deleteCurrentClub()"
            style="display:none;"
        >
            🗑️ このクラブを削除
        </button>
    </div>
</div>
</div>
<script>
let clubs = [];
let editingId = null;
let detailId = null;
let currentPhoto = null;
const STORAGE_KEY = "golfClubManagerData";
/* =========================
   選択値
========================= */
let selected = {
    distance: "",
    carry: "",
    clubWeight: "",
    clubLength: "",
    loft: "",
    lieAngle: "",
    bounce: "",
    shaftWeight: "",
    shaftLength: ""
};
/* =========================
   データ読み込み
========================= */
function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            clubs = JSON.parse(saved);
        } catch {
            clubs = [];
        }
    }
    renderClubs();
}
/* =========================
   データ保存
========================= */
function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}
/* =========================
   一覧
========================= */
function renderClubs() {
    const grid =
        document.getElementById("clubGrid");
    const keyword =
        document.getElementById("search")
        .value
        .toLowerCase();
    const filtered =
        clubs.filter(club => {
            const text = [
                club.clubType,
                club.maker,
                club.name,
                club.shaft
            ]
            .join(" ")
            .toLowerCase();
            return text.includes(keyword);
        });
    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty">
                <div style="font-size:45px;">⛳</div>
                <h2>クラブがありません</h2>
                <p>「＋ 追加」からクラブを登録できます。</p>
            </div>
        `;
        return;
    }
    grid.innerHTML =
        filtered.map(club => {
            const photo =
                club.photo
                ? `<img class="club-photo" src="${club.photo}">`
                : `<div class="no-photo">⛳</div>`;
            return `
                <div
                    class="club-card"
                    onclick="openDetail('${club.id}')"
                >
                    ${photo}
                    <div class="card-body">
                        <div class="club-type">
                            ${escapeHTML(
                                club.clubType || "-"
                            )}
                        </div>
                        <div class="maker">
                            ${escapeHTML(
                                club.maker || "-"
                            )}
                        </div>
                        <div class="name">
                            ${escapeHTML(
                                club.name || "-"
                            )}
                        </div>
                        <div class="distance">
                            <div class="distance-box">
                                <small>総飛距離</small>
                                <strong>
                                    ${escapeHTML(
                                        club.distance || "-"
                                    )}
                                </strong>
                            </div>
                            <div class="distance-box">
                                <small>キャリー</small>
                                <strong>
                                    ${escapeHTML(
                                        club.carry || "-"
                                    )}
                                </strong>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join("");
}
/* =========================
   詳細
========================= */
function openDetail(id) {
    const club =
        clubs.find(c => c.id === id);
    if (!club) return;
    detailId = id;
    const photo =
        club.photo
        ? `<img class="detail-photo" src="${club.photo}">`
        : "";
    document.getElementById("detailBody")
        .innerHTML = `
            ${photo}
            <div class="detail-title">
                ${escapeHTML(club.clubType || "-")}
            </div>
            <div class="detail-maker">
                ${escapeHTML(club.maker || "メーカー未入力")}
            </div>
            <div class="detail-name">
                ${escapeHTML(club.name || "商品名未入力")}
            </div>
            <div class="big-distance">
                <div class="big-distance-box">
                    <small>総飛距離</small>
                    <strong>
                        ${escapeHTML(club.distance || "-")}
                    </strong>
                </div>
                <div class="big-distance-box">
                    <small>キャリー</small>
                    <strong>
                        ${escapeHTML(club.carry || "-")}
                    </strong>
                </div>
            </div>
            <div class="detail-specs">
                ${detailSpec("クラブ重量", club.clubWeight)}
                ${detailSpec("クラブ長さ", club.clubLength)}
                ${detailSpec("ロフト角", club.loft)}
                ${detailSpec("ライ角", club.lieAngle)}
                ${detailSpec("バンス角", club.bounce)}
                ${detailSpec("シャフト", club.shaft)}
                ${detailSpec("フレックス", club.flex)}
                ${detailSpec("シャフト重量", club.shaftWeight)}
                ${detailSpec("シャフト長さ", club.shaftLength)}
                ${detailSpec("キックポイント", club.kickPoint)}
                ${detailSpec("グリップ交換日", club.gripDate)}
            </div>
            ${
                club.memo
                ? `
                    <div class="detail-memo">
                        <strong>メモ</strong><br><br>
                        ${escapeHTML(club.memo)}
                    </div>
                `
                : ""
            }
            <button
                class="secondary detail-close"
                onclick="closeDetail()"
            >
                閉じる
            </button>
        `;
    document.getElementById("detailModal")
        .style.display = "block";
}
function detailSpec(title, value) {
    return `
        <div class="detail-spec">
            <small>${title}</small>
            <strong>
                ${escapeHTML(value || "-")}
            </strong>
        </div>
    `;
}
function closeDetail() {
    document.getElementById("detailModal")
        .style.display = "none";
}
/* =========================
   詳細 → 編集
========================= */
function editFromDetail() {
    const id = detailId;
    closeDetail();
    if (id) {
        openEditModal(id);
    }
}
/* =========================
   追加
========================= */
function openAddModal() {
    editingId = null;
    currentPhoto = null;
    document.getElementById("modalTitle")
        .textContent = "新しいクラブ";
    document.getElementById("deleteButton")
        .style.display = "none";
    clearForm();
    document.getElementById("modal")
        .style.display = "block";
}
/* =========================
   編集
========================= */
function openEditModal(id) {
    const club =
        clubs.find(c => c.id === id);
    if (!club) return;
    editingId = id;
    currentPhoto =
        club.photo || null;
    document.getElementById("modalTitle")
        .textContent = "クラブを編集";
    document.getElementById("deleteButton")
        .style.display = "block";
    document.getElementById("clubType").value =
        club.clubType || "1W";
    document.getElementById("maker").value =
        club.maker || "";
    document.getElementById("name").value =
        club.name || "";
    document.getElementById("shaft").value =
        club.shaft || "";
    document.getElementById("flex").value =
        club.flex || "S";
    document.getElementById("kickPoint").value =
        club.kickPoint || "中調子";
    document.getElementById("gripDate").value =
        club.gripDate || "";
    document.getElementById("memo").value =
        club.memo || "";
    selected.distance =
        club.distance || "";
    selected.carry =
        club.carry || "";
    selected.clubWeight =
        club.clubWeight || "";
    selected.clubLength =
        club.clubLength || "";
    selected.loft =
        club.loft || "";
    selected.lieAngle =
        club.lieAngle || "";
    selected.bounce =
        club.bounce || "";
    selected.shaftWeight =
        club.shaftWeight || "";
    selected.shaftLength =
        club.shaftLength || "";
    updateAllDisplays();
    const preview =
        document.getElementById("preview");
    if (currentPhoto) {
        preview.src = currentPhoto;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }
    document.getElementById("modal")
        .style.display = "block";
}

/* =========================
   5ヤード選択
========================= */
function createDistanceButtons() {
    const targets = [
        ["distanceButtons", "distance", 50, 350, 5],
        ["carryButtons", "carry", 30, 330, 5]
    ];
    targets.forEach(item => {
        const [elementId, key, min, max, step] = item;
        const element =
            document.getElementById(elementId);
        let html = "";
        for (let n = min; n <= max; n += step) {
            const value = n + " yd";
            html += `
                <button
                    type="button"
                    data-key="${key}"
                    data-value="${value}"
                >
                    ${n}
                </button>
            `;
        }
        element.innerHTML = html;
    });
    document.querySelectorAll(
        "#distanceButtons button, #carryButtons button"
    ).forEach(button => {
        button.onclick = function() {
            const key =
                this.dataset.key;
            selected[key] =
                this.dataset.value;
            updateAllDisplays();
            highlightButtons(
                key,
                this.dataset.value
            );
        };
    });
}
/* =========================
   数字キー
========================= */
function createNumberKeyboard(
    elementId,
    key,
    min,
    max,
    step,
    unit
) {
    const element =
        document.getElementById(elementId);
    let html = "";
    for (
        let n = min;
        n <= max;
        n += step
    ) {
        const value =
            formatNumber(n, unit);
        html += `
            <button
                type="button"
                data-key="${key}"
                data-value="${value}"
            >
                ${n}
            </button>
        `;
    }
    element.innerHTML = html;
    element.querySelectorAll("button")
        .forEach(button => {
            button.onclick = function() {
                selected[
                    this.dataset.key
                ] = this.dataset.value;
                updateAllDisplays();
                highlightButtons(
                    this.dataset.key,
                    this.dataset.value
                );
            };
        });
}
function formatNumber(number, unit) {
    return number + " " + unit;
}
/* =========================
   数字キー作成
========================= */
function createAllKeyboards() {
    /*
        重量
        50g ～ 450g
        1g単位
    */
    createNumberKeyboard(
        "clubWeightButtons",

        450,

    /*

}
/* =========================
   ボタン選択表示
========================= */
function highlightButtons(key, value) {
    document
        .querySelectorAll(
            `[data-key="${key}"]`
        )
        .forEach(button => {
            button.classList.toggle(
                "selected-number",
                button.dataset.value === value
            );
        });
}
/* =========================
   保存
========================= */
function saveClub() {
    const data = {
        clubType:
            document.getElementById("clubType").value,
        maker:
            document.getElementById("maker").value,
        name:
            document.getElementById("name").value,
        distance:
            selected.distance,
        carry:
            selected.carry,
        clubWeight:
            selected.clubWeight,
        clubLength:
            selected.clubLength,
        loft:
            selected.loft,
        lieAngle:
            selected.lieAngle,
        bounce:
            selected.bounce,
        shaft:
            document.getElementById("shaft").value,
        flex:
            document.getElementById("flex").value,
        shaftWeight:
            selected.shaftWeight,
        shaftLength:
            selected.shaftLength,
        kickPoint:
            document.getElementById("kickPoint").value,
        gripDate:
            document.getElementById("gripDate").value,
        memo:
            document.getElementById("memo").value,
        photo:
            currentPhoto
    };
    if (editingId) {
        const index =
            clubs.findIndex(
                c => c.id === editingId
            );
        if (index !== -1) {
            clubs[index] = {
                ...clubs[index],
                ...data
            };
        }
    } else {
        clubs.push({
            id:
                Date.now().toString(),
            ...data
        });
    }
    saveData();
    renderClubs();
    closeModal();
}
/* =========================
   写真
========================= */
document
    .getElementById("photo")
    .addEventListener(
        "change",
        function(event) {
            const file =
                event.target.files[0];
            if (!file) return;
            const reader =
                new FileReader();
            reader.onload =
                function(e) {
                    currentPhoto =
                        e.target.result;
                    const preview =
                        document.getElementById(
                            "preview"
                        );
                    preview.src =
                        currentPhoto;
                    preview.style.display =
                        "block";
                };
            reader.readAsDataURL(file);
        }
    );
/* =========================
   削除
========================= */
function deleteCurrentClub() {
    if (!editingId) return;
    if (!confirm(
        "このクラブを削除しますか？\n\nこの操作は元に戻せません。"
    )) {
        return;
    }
    clubs =
        clubs.filter(
            club =>
                club.id !== editingId
        );
    saveData();
    renderClubs();
    closeModal();
}
/* =========================
   モーダル閉じる
========================= */
function closeModal() {
    document.getElementById("modal")
        .style.display = "none";
}
/* =========================
   検索
========================= */
document
    .getElementById("search")
    .addEventListener(
        "input",
        renderClubs
    );
/* =========================
   HTMLエスケープ
========================= */
function escapeHTML(value) {
    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}
/* =========================
   起動
========================= */
createDistanceButtons();
createAllKeyboards();
loadData();
