<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:#f4f6f5;
    color:#222;
}

header{
    background:#126b3a;
    color:white;
    padding:14px 18px;
}

header h1{
    margin:0;
    font-size:21px;
}

header p{
    margin:3px 0 0;
    font-size:12px;
    opacity:.85;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:10px;
}

.toolbar{
    display:flex;
    gap:7px;
    margin-bottom:10px;
}

.search{
    flex:1;
    min-width:0;
}

input,select,textarea,button{
    font:inherit;
}

input,select,textarea{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
}

button{
    border:0;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

.primary{
    background:#126b3a;
    color:white;
}

.secondary{
    background:#e5e9e7;
}

.danger{
    background:#d9363e;
    color:white;
}

/* =========================
   一覧
========================= */

.club-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.club-card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 7px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.15s;
}

.club-card:active{
    transform:scale(.98);
}

.club-photo{
    width:100%;
    height:105px;
    object-fit:cover;
    background:#e9eceb;
}

.no-photo{
    height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e9eceb;
    color:#777;
    font-size:30px;
}

.card-body{
    padding:8px;
}

.club-type{
    color:#126b3a;
    font-size:18px;
    font-weight:800;
}

.maker{
    color:#777;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.name{
    font-size:13px;
    font-weight:700;
    margin:2px 0 6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.distance{
    display:flex;
    gap:4px;
}

.distance-box{
    flex:1;
    background:#edf7f1;
    padding:5px;
    border-radius:6px;
}

.distance-box small{
    display:block;
    color:#777;
    font-size:9px;
}

.distance-box strong{
    display:block;
    margin-top:1px;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
    grid-column:1/-1;
}

/* =========================
   モーダル
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:10;
    overflow-y:auto;
    padding:10px;
}

.modal-content{
    max-width:700px;
    margin:10px auto;
    background:white;
    border-radius:16px;
    padding:16px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close-button{
    width:38px;
    height:38px;
    padding:0;
    border-radius:50%;
    font-size:22px;
    background:#eee;
}

/* =========================
   詳細
========================= */

.detail-photo{
    width:100%;
    max-height:330px;
    object-fit:contain;
    background:#eee;
    border-radius:10px;
    margin-bottom:12px;
}

.detail-no-photo{
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    border-radius:10px;
    font-size:60px;
    color:#777;
    margin-bottom:12px;
}

.detail-type{
    font-size:28px;
    font-weight:800;
    color:#126b3a;
}

.detail-maker{
    color:#777;
    margin-top:2px;
}

.detail-name{
    font-size:22px;
    font-weight:700;
    margin:3px 0 15px;
}

.detail-distance{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:15px;
}

.detail-distance-box{
    background:#edf7f1;
    border-radius:10px;
    padding:12px;
}

.detail-distance-box small{
    display:block;
    color:#777;
}

.detail-distance-box strong{
    display:block;
    font-size:22px;
    margin-top:3px;
}

.detail-specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.detail-spec{
    background:#f5f6f6;
    padding:10px;
    border-radius:8px;
}

.detail-spec small{
    display:block;
    color:#777;
    font-size:11px;
}

.detail-spec strong{
    display:block;
    margin-top:2px;
}

.detail-memo{
    margin-top:12px;
    padding:12px;
    background:#f5f6f6;
    border-radius:8px;
    white-space:pre-wrap;
}

/* =========================
   フォーム
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.form-group{
    margin-bottom:7px;
}

.form-group label{
    display:block;
    font-size:12px;
    color:#555;
    margin-bottom:3px;
}

.full{
    grid-column:1/-1;
}

.preview{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border-radius:10px;
    margin-top:8px;
}

.modal-actions{
    margin-top:14px;
}

.modal-actions .save-button{
    width:100%;
    font-size:16px;
    padding:12px;
}

.delete-area{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #ddd;
}

.delete-area button{
    width:100%;
}

/* =========================
   数字キー
========================= */

.number-picker{
    position:relative;
}

.number-display{
    width:100%;
    min-height:42px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:9px 42px 9px 11px;
    cursor:pointer;
}

.number-display.placeholder{
    color:#999;
}

.picker-clear{
    position:absolute;
    right:5px;
    top:5px;
    width:32px;
    height:32px;
    padding:0;
    border-radius:6px;
    background:#eee;
    font-size:16px;
}

.keypad{
    display:none;
    margin-top:6px;
    background:#f1f3f2;
    border-radius:10px;
    padding:7px;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.keypad.open{
    display:grid;
}

.keypad button{
    background:white;
    min-height:42px;
    border:1px solid #ddd;
    font-weight:600;
}

.keypad button:active{
    background:#dfeee6;
}

.unit-title{
    font-size:10px;
    color:#777;
    text-align:center;
    grid-column:1/-1;
    padding:2px;
}

/* =========================
   レスポンシブ
========================= */

@media(max-width:1100px){
    .club-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:800px){
    .club-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .club-photo,
    .no-photo{
        height:100px;
    }
}

@media(max-width:600px){
    .container{
        padding:7px;
    }

    .club-grid{
        grid-template-columns:repeat(2,1fr);
        gap:7px;
    }

    .club-photo,
    .no-photo{
        height:90px;
    }

    .card-body{
        padding:7px;
    }

    .club-type{
        font-size:17px;
    }

    .name{
        font-size:12px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .modal{
        padding:5px;
    }

    .modal-content{
        margin:5px auto;
        padding:13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>

<div class="container">

    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 番手・メーカー・商品名"
        >

        <button class="primary" onclick="openAddModal()">
            ＋ 追加
        </button>
    </div>

    <div id="clubGrid" class="club-grid"></div>

</div>


<!-- =========================
     詳細画面
========================= -->

<div id="detailModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>クラブ詳細</h2>

            <div>
                <button
                    class="primary"
                    onclick="editFromDetail()"
                >
                    ✏️ 編集
                </button>

                <button
                    class="close-button"
                    onclick="closeDetail()"
                >
                    ×
                </button>
            </div>
        </div>

        <div id="detailContent"></div>

    </div>
</div>


<!-- =========================
     編集画面
========================= -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="modalTitle">新しいクラブ</h2>

            <button
                class="close-button"
                onclick="closeEditModal()"
            >
                ×
            </button>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>番手</label>

                <select id="clubType">
                    <option>1W</option>
                    <option>2W</option>
                    <option>3W</option>
                    <option>4W</option>
                    <option>5W</option>
                    <option>7W</option>
                    <option>9W</option>
                    <option>2U</option>
                    <option>3U</option>
                    <option>4U</option>
                    <option>5U</option>
                    <option>6U</option>
                    <option>1I</option>
                    <option>2I</option>
                    <option>3I</option>
                    <option>4I</option>
                    <option>5I</option>
                    <option>6I</option>
                    <option>7I</option>
                    <option>8I</option>
                    <option>9I</option>
                    <option>PW</option>
                    <option>AW</option>
                    <option>SW</option>
                    <option>LW</option>
                    <option>チッパー</option>
                    <option>パター</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>メーカー</label>
                <input id="maker" placeholder="例：TaylorMade">
            </div>

            <div class="form-group full">
                <label>商品名</label>
                <input id="name" placeholder="例：Qi35">
            </div>


            <!-- 総飛距離 -->

            <div class="form-group">
                <label>総飛距離</label>

                <div class="number-picker">

                    <div
                        id="distanceDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('distance')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('distance')"
                    >
                        ×
                    </button>

                    <div id="distanceKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- キャリー -->

            <div class="form-group">
                <label>キャリー</label>

                <div class="number-picker">

                    <div
                        id="carryDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('carry')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('carry')"
                    >
                        ×
                    </button>

                    <div id="carryKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- クラブ重量 -->

            <div class="form-group">
                <label>クラブ重量</label>

                <div class="number-picker">

                    <div
                        id="clubWeightDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('clubWeight')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('clubWeight')"
                    >
                        ×
                    </button>

                    <div id="clubWeightKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- クラブ長さ -->

            <div class="form-group">
                <label>クラブ長さ</label>

                <div class="number-picker">

                    <div
                        id="clubLengthDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('clubLength')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('clubLength')"
                    >
                        ×
                    </button>

                    <div id="clubLengthKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- ロフト角 -->

            <div class="form-group">
                <label>ロフト角</label>

                <div class="number-picker">

                    <div
                        id="loftDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('loft')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('loft')"
                    >
                        ×
                    </button>

                    <div id="loftKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- ライ角 -->

            <div class="form-group">
                <label>ライ角</label>

                <div class="number-picker">

                    <div
                        id="lieAngleDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('lieAngle')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('lieAngle')"
                    >
                        ×
                    </button>

                    <div id="lieAngleKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- バンス角 -->

            <div class="form-group">
                <label>バンス角</label>

                <div class="number-picker">

                    <div
                        id="bounceDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('bounce')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('bounce')"
                    >
                        ×
                    </button>

                    <div id="bounceKeypad" class="keypad"></div>

                </div>
            </div>


            <div class="form-group">
                <label>シャフト名</label>
                <input id="shaft" placeholder="例：VENTUS TR">
            </div>

            <div class="form-group">
                <label>フレックス</label>

                <select id="flex">
                    <option>R2</option>
                    <option>R</option>
                    <option>SR</option>
                    <option selected>S</option>
                    <option>SX</option>
                    <option>X</option>
                    <option>TX</option>
                    <option>その他</option>
                </select>
            </div>


            <!-- シャフト重量 -->

            <div class="form-group">
                <label>シャフト重量</label>

                <div class="number-picker">

                    <div
                        id="shaftWeightDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('shaftWeight')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('shaftWeight')"
                    >
                        ×
                    </button>

                    <div id="shaftWeightKeypad" class="keypad"></div>

                </div>
            </div>


            <!-- シャフト長さ -->

            <div class="form-group">
                <label>シャフト長さ</label>

                <div class="number-picker">

                    <div
                        id="shaftLengthDisplay"
                        class="number-display placeholder"
                        onclick="toggleKeypad('shaftLength')"
                    >
                        選択してください
                    </div>

                    <button
                        class="picker-clear"
                        onclick="clearNumber('shaftLength')"
                    >
                        ×
                    </button>

                    <div id="shaftLengthKeypad" class="keypad"></div>

                </div>
            </div>


            <div class="form-group">
                <label>キックポイント</label>

                <select id="kickPoint">
                    <option>元調子</option>
                    <option>中元調子</option>
                    <option selected>中調子</option>
                    <option>先中調子</option>
                    <option>先調子</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>グリップ交換日</label>
                <input id="gripDate" type="date">
            </div>


            <div class="form-group full">
                <label>クラブ写真</label>

                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >

                <img
                    id="preview"
                    class="preview"
                    style="display:none;"
                >
            </div>


            <div class="form-group full">
                <label>メモ</label>

                <textarea
                    id="memo"
                    rows="4"
                    placeholder="クラブについてのメモ"
                ></textarea>
            </div>

        </div>


        <div class="modal-actions">

            <button
                class="primary save-button"
                onclick="saveClub()"
            >
                💾 保存
            </button>

        </div>


        <!-- 削除は一番下 -->

        <div
            id="deleteArea"
            class="delete-area"
            style="display:none;"
        >

            <button
                class="danger"
                onclick="deleteCurrentClub()"
            >
                🗑️ このクラブを削除
            </button>

        </div>

    </div>
</div>


<script>

let clubs=[];
let editingId=null;
let detailId=null;
let currentPhoto=null;

const STORAGE_KEY="golfClubManagerData";

const numberValues={
    distance:[],
    carry:[],
    clubWeight:[],
    clubLength:[],
    loft:[],
    lieAngle:[],
    bounce:[],
    shaftWeight:[],
    shaftLength:[]
};

const selectedNumbers={};


/* =========================
   数値候補作成
========================= */

for(let i=50;i<=350;i+=5){
    numberValues.distance.push(i);
    numberValues.carry.push(i);
}

for(let i=200;i<=400;i++){
    numberValues.clubWeight.push(i);
}

for(let i=30;i<=50;i+=0.5){
    numberValues.clubLength.push(Number(i.toFixed(1)));
}

for(let i=0;i<=30;i+=0.5){
    numberValues.loft.push(Number(i.toFixed(1)));
}

for(let i=50;i<=65;i+=0.5){
    numberValues.lieAngle.push(Number(i.toFixed(1)));
}

for(let i=0;i<=16;i+=0.5){
    numberValues.bounce.push(Number(i.toFixed(1)));
}

for(let i=30;i<=130;i++){
    numberValues.shaftWeight.push(i);
}

for(let i=30;i<=50;i+=0.5){
    numberValues.shaftLength.push(Number(i.toFixed(1)));
}


/* =========================
   単位
========================= */

function unitFor(type){

    if(type==="distance" || type==="carry"){
        return "yd";
    }

    if(type==="clubWeight" || type==="shaftWeight"){
        return "g";
    }

    if(
        type==="loft" ||
        type==="lieAngle" ||
        type==="bounce"
    ){
        return "°";
    }

    if(
        type==="clubLength" ||
        type==="shaftLength"
    ){
        return "inch";
    }

    return "";
}


/* =========================
   キーパッド作成
========================= */

function createKeypads(){

    Object.keys(numberValues).forEach(type=>{

        const keypad=document.getElementById(type+"Keypad");

        keypad.innerHTML="";

        const title=document.createElement("div");

        title.className="unit-title";

        title.textContent="選択すると自動で単位が付きます";

        keypad.appendChild(title);

        numberValues[type].forEach(value=>{

            const button=document.createElement("button");

            button.type="button";

            button.textContent=
                value+" "+unitFor(type);

            button.onclick=function(event){

                event.stopPropagation();

                selectNumber(type,value);
            };

            keypad.appendChild(button);
        });
    });
}


/* =========================
   数値選択
========================= */

function toggleKeypad(type){

    const keypad=document.getElementById(type+"Keypad");

    document.querySelectorAll(".keypad").forEach(k=>{
        if(k!==keypad){
            k.classList.remove("open");
        }
    });

    keypad.classList.toggle("open");
}


function selectNumber(type,value){

    selectedNumbers[type]=value;

    const display=
        document.getElementById(type+"Display");

    display.textContent=
        value+" "+unitFor(type);

    display.classList.remove("placeholder");

    document.getElementById(type+"Keypad")
        .classList.remove("open");
}


function clearNumber(type){

    selectedNumbers[type]="";

    const display=
        document.getElementById(type+"Display");

    display.textContent="選択してください";

    display.classList.add("placeholder");
}


/* =========================
   データ読み込み
========================= */

function loadData(){

    const saved=
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        try{
            clubs=JSON.parse(saved);
        }catch{
            clubs=[];
        }
    }

    renderClubs();
}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}


/* =========================
   一覧
========================= */

function renderClubs(){

    const grid=
        document.getElementById("clubGrid");

    const keyword=
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered=clubs.filter(club=>{

        const text=[
            club.clubType,
            club.maker,
            club.name,
            club.shaft
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(keyword);
    });


    if(filtered.length===0){

        grid.innerHTML=`
            <div class="empty">
                <div style="font-size:45px;">⛳</div>
                <h3>クラブがありません</h3>
                <p>「＋ 追加」から登録してください。</p>
            </div>
        `;

        return;
    }


    grid.innerHTML=
        filtered.map(club=>{

            const photo=
                club.photo
                ? `<img class="club-photo" src="${club.photo}">`
                : `<div class="no-photo">⛳</div>`;


            return `
                <div
                    class="club-card"
                    onclick="openDetail('${club.id}')"
                >

                    ${photo}

                    <div class="card-body">

                        <div class="club-type">
                            ${escapeHTML(club.clubType||"-")}
                        </div>

                        <div class="maker">
                            ${escapeHTML(club.maker||"")}
                        </div>

                        <div class="name">
                            ${escapeHTML(club.name||"")}
                        </div>

                        <div class="distance">

                            <div class="distance-box">
                                <small>総飛距離</small>
                                <strong>
                                    ${escapeHTML(formatValue(club.distance,"yd"))}
                                </strong>
                            </div>

                            <div class="distance-box">
                                <small>キャリー</small>
                                <strong>
                                    ${escapeHTML(formatValue(club.carry,"yd"))}
                                </strong>
                            </div>

                        </div>

                    </div>

                </div>
            `;

        }).join("");
}


function formatValue(value,unit){

    if(value===undefined || value===""){
        return "-";
    }

    if(String(value).includes(unit)){
        return value;
    }

    return value+" "+unit;
}

function closeDetail(){

function editFromDetail(){

/* =========================
   編集
========================= */

function openEditModal(id){

    const club=
        clubs.find(c=>c.id===id);

    if(!club) return;

    editingId=id;

    currentPhoto=club.photo||null;


    document.getElementById("modalTitle")
        .textContent="クラブを編集";


    document.getElementById("deleteArea")
        .style.display="block";


    document.getElementById("clubType")
        .value=club.clubType||"1W";

    document.getElementById("maker")
        .value=club.maker||"";

    document.getElementById("name")
        .value=club.name||"";

    document.getElementById("shaft")
        .value=club.shaft||"";

    document.getElementById("flex")
        .value=club.flex||"S";

    document.getElementById("kickPoint")
        .value=club.kickPoint||"中調子";

    document.getElementById("gripDate")
        .value=club.gripDate||"";

    document.getElementById("memo")
        .value=club.memo||"";


    setNumberFromData(
        "distance",
        club.distance
    );

    setNumberFromData(
        "carry",
        club.carry
    );

    setNumberFromData(
        "clubWeight",
        club.clubWeight
    );

    setNumberFromData(
        "clubLength",
        club.clubLength
    );

    setNumberFromData(
        "loft",
        club.loft
    );

    setNumberFromData(
        "lieAngle",
        club.lieAngle
    );

    setNumberFromData(
        "bounce",
        club.bounce
    );

    setNumberFromData(
        "shaftWeight",
        club.shaftWeight
    );

    setNumberFromData(
        "shaftLength",
        club.shaftLength
    );


    const preview=
        document.getElementById("preview");


    if(currentPhoto){

        preview.src=currentPhoto;
        preview.style.display="block";

    }else{

        preview.style.display="none";
    }


    document.getElementById("photo")
        .value="";


    document.getElementById("editModal")
        .style.display="block";
}


function setNumberFromData(type,value){

    if(value===undefined || value===""){

        clearNumber(type);

        return;
    }


    let number=
        parseFloat(
            String(value)
                .replace("yd","")
                .replace("g","")
                .replace("inch","")
                .replace("°","")
                .trim()
        );


    if(isNaN(number)){

        clearNumber(type);

        return;
    }


    selectedNumbers[type]=number;


    const display=
        document.getElementById(type+"Display");

    display.textContent=
        number+" "+unitFor(type);

    display.classList.remove("placeholder");
}

/* =========================
   保存
========================= */

function saveClub(){

    const data={

        clubType:
            document.getElementById("clubType").value,

        maker:
            document.getElementById("maker").value,

        name:
            document.getElementById("name").value,

        distance:
            selectedNumbers.distance==="undefined"
            ? ""
            : selectedNumbers.distance,

        carry:
            selectedNumbers.carry==="undefined"
            ? ""
            : selectedNumbers.carry,

        clubWeight:
            selectedNumbers.clubWeight==="undefined"
            ? ""
            : selectedNumbers.clubWeight,

        clubLength:
            selectedNumbers.clubLength==="undefined"
            ? ""
            : selectedNumbers.clubLength,

        loft:
            selectedNumbers.loft==="undefined"
            ? ""
            : selectedNumbers.loft,

        lieAngle:
            selectedNumbers.lieAngle==="undefined"
            ? ""
            : selectedNumbers.lieAngle,

        bounce:
            selectedNumbers.bounce==="undefined"
            ? ""
            : selectedNumbers.bounce,

        shaft:
            document.getElementById("shaft").value,

        flex:
            document.getElementById("flex").value,

        shaftWeight:
            selectedNumbers.shaftWeight==="undefined"
            ? ""
            : selectedNumbers.shaftWeight,

        shaftLength:
            selectedNumbers.shaftLength==="undefined"
            ? ""
            : selectedNumbers.shaftLength,

        kickPoint:
            document.getElementById("kickPoint").value,

        gripDate:
            document.getElementById("gripDate").value,

        memo:
            document.getElementById("memo").value,

        photo:currentPhoto
    };


    if(editingId){

        const index=
            clubs.findIndex(
                c=>c.id===editingId
            );

        if(index!==-1){

            clubs[index]={
                ...clubs[index],
                ...data
            };
        }

    }else{

        clubs.push({

            id:
                Date.now().toString(),

            ...data
        });
    }


    saveData();

    renderClubs();

    closeEditModal();
}


/* =========================
   写真
========================= */

document.getElementById("photo")
.addEventListener(
    "change",
    function(event){

        const file=
            event.target.files[0];

        if(!file) return;


        const reader=
            new FileReader();


        reader.onload=function(e){

            currentPhoto=e.target.result;

            const preview=
                document.getElementById("preview");

            preview.src=currentPhoto;

            preview.style.display="block";
        };


        reader.readAsDataURL(file);
    }
);


/* =========================
   削除
========================= */

function deleteCurrentClub(){

    if(!editingId) return;


    if(!confirm(
        "このクラブを削除しますか？\nこの操作は元に戻せません。"
    )){
        return;
    }


    clubs=
        clubs.filter(
            club=>club.id!==editingId
        );


    saveData();

    renderClubs();

    closeEditModal();
}


function deleteClub(id){

    if(!confirm(
        "このクラブを削除しますか？"
    )){
        return;
    }


    clubs=
        clubs.filter(
            club=>club.id!==id
        );


    saveData();

    renderClubs();
}

/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value){

    return String(value||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
