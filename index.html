<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f4f6f5;
    color: #222;
}

/* =========================
   ヘッダー
========================= */

header {
    background: #126b3a;
    color: white;
    padding: 10px 14px;
}

header h1 {
    margin: 0;
    font-size: 19px;
}

header p {
    margin: 2px 0 0;
    font-size: 11px;
    opacity: .85;
}

/* =========================
   メイン
========================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 8px;
}

.toolbar {
    display: flex;
    gap: 7px;
    margin-bottom: 8px;
}

input,
select,
textarea,
button {
    font: inherit;
}

input,
select,
textarea {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
}

.search {
    flex: 1;
    min-width: 0;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
}

.primary {
    background: #126b3a;
    color: white;
}

.secondary {
    background: #e5e9e7;
}

.danger {
    background: #d9363e;
    color: white;
}

/* =========================
   横長一覧
========================= */

.club-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

/*
   1クラブ＝横長1行
   高さを抑えて10個程度見える
*/

.club-card {
    width: 100%;
    min-height: 76px;
    background: white;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
    display: flex;
    align-items: stretch;
    cursor: pointer;
    transition: transform .1s;
}

.club-card:active {
    transform: scale(.99);
}

/* 写真 */

.club-photo {
    width: 85px;
    min-width: 85px;
    height: 76px;
    object-fit: cover;
    background: #e9eceb;
}

.no-photo {
    width: 85px;
    min-width: 85px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9eceb;
    color: #777;
    font-size: 27px;
}

/* 中央 */

.card-body {
    flex: 1;
    min-width: 0;
    padding: 6px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.club-main {
    width: 180px;
    min-width: 180px;
}

.club-type {
    color: #126b3a;
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
}

.maker {
    color: #777;
    font-size: 10px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.name {
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 距離 */

.distance {
    display: flex;
    gap: 5px;
    flex: 1;
    min-width: 150px;
}

.distance-box {
    flex: 1;
    min-width: 70px;
    background: #edf7f1;
    border-radius: 7px;
    padding: 6px 8px;
}

.distance-box small {
    display: block;
    color: #777;
    font-size: 9px;
}

.distance-box strong {
    display: block;
    color: #126b3a;
    font-size: 14px;
    margin-top: 1px;
}

/* 簡易スペック */

.card-mini-info {
    width: 180px;
    min-width: 180px;
    font-size: 10px;
    color: #555;
    line-height: 1.7;
}

.mini-label {
    color: #888;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

/* =========================
   詳細画面
========================= */

.detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 20;
    overflow-y: auto;
    padding: 8px;
}

.detail-content {
    max-width: 650px;
    margin: 5px auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: white;
    z-index: 2;
}

.detail-header h2 {
    margin: 0;
    font-size: 18px;
}

.edit-top-button {
    background: #126b3a;
    color: white;
    padding: 8px 13px;
}

.detail-photo {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    background: #eee;
}

.detail-no-photo {
    height: 170px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9eceb;
    font-size: 55px;
}

.detail-body {
    padding: 15px;
}

.detail-title {
    color: #126b3a;
    font-size: 29px;
    font-weight: 900;
}

.detail-maker {
    color: #777;
    margin-top: 2px;
}

.detail-name {
    font-size: 20px;
    font-weight: 800;
    margin: 4px 0 13px;
}

.detail-distance {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 13px;
}

.big-distance {
    background: #edf7f1;
    border-radius: 9px;
    padding: 11px;
    text-align: center;
}

.big-distance small {
    display: block;
    color: #666;
}

.big-distance strong {
    display: block;
    color: #126b3a;
    font-size: 22px;
    margin-top: 2px;
}

.detail-specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.detail-spec {
    background: #f5f6f6;
    border-radius: 8px;
    padding: 8px;
}

.detail-spec small {
    display: block;
    color: #777;
    font-size: 10px;
}

.detail-spec strong {
    display: block;
    margin-top: 2px;
    font-size: 13px;
}

.detail-memo {
    background: #fffbe8;
    padding: 11px;
    border-radius: 8px;
    margin-top: 11px;
    white-space: pre-wrap;
}

/* =========================
   編集画面
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 30;
    overflow-y: auto;
    padding: 8px;
}

.modal-content {
    max-width: 700px;
    margin: 5px auto;
    background: white;
    border-radius: 15px;
    padding: 15px;
}

.modal h2 {
    margin: 0 0 14px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.form-group {
    margin-bottom: 7px;
}

.form-group label {
    display: block;
    font-size: 11px;
    color: #555;
    margin-bottom: 4px;
}

.full {
    grid-column: 1 / -1;
}

.preview {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 9px;
    margin-top: 7px;
}

.modal-actions {
    display: flex;
    gap: 7px;
    margin-top: 16px;
}

.modal-actions button {
    flex: 1;
}

.delete-area {
    margin-top: 20px;
    padding-top: 13px;
    border-top: 1px solid #ddd;
}

.delete-area button {
    width: 100%;
}

/* =========================
   選択パネル
========================= */

.choice-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
}

.choice-box {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 17px 17px 0 0;
    padding: 14px;
    max-height: 75vh;
    overflow-y: auto;
}

.choice-box h3 {
    margin: 0 0 11px;
    text-align: center;
}

.choice-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

.choice-button {
    background: #edf7f1;
    color: #126b3a;
    font-weight: 700;
    padding: 10px 3px;
    font-size: 13px;
}

.choice-button:active {
    background: #126b3a;
    color: white;
}

/* =========================
   数字キーパッド
========================= */

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 9px;
}

.key {
    background: #f0f2f1;
    font-size: 20px;
    font-weight: 700;
    padding: 14px;
}

.key:active {
    background: #dce5df;
}

.key-wide {
    grid-column: span 2;
}

.key-ok {
    background: #126b3a;
    color: white;
}

.unit-preview {
    text-align: center;
    background: #f5f6f6;
    border-radius: 9px;
    padding: 11px;
    font-size: 24px;
    font-weight: 800;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    header {
        padding: 9px 12px;
    }

    header h1 {
        font-size: 17px;
    }

    .container {
        padding: 6px;
    }

    .toolbar {
        margin-bottom: 6px;
    }

    .club-card {
        min-height: 61px;
    }

    .club-photo,
    .no-photo {
        width: 65px;
        min-width: 65px;
        height: 61px;
    }

    .no-photo {
        font-size: 22px;
    }

    .card-body {
        padding: 4px 6px;
        gap: 5px;
    }

    .club-main {
        width: 82px;
        min-width: 82px;
    }

    .club-type {
        font-size: 16px;
    }

    .maker {
        font-size: 8px;
    }

    .name {
        font-size: 9px;
    }

    .distance {
        gap: 3px;
        min-width: 105px;
    }

    .distance-box {
        min-width: 50px;
        padding: 4px;
    }

    .distance-box small {
        font-size: 7px;
    }

    .distance-box strong {
        font-size: 10px;
    }

    .card-mini-info {
        display: none;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .detail-specs {
        grid-template-columns: 1fr 1fr;
    }

    .detail-content,
    .modal-content {
        margin: 3px auto;
    }

    .choice-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>

<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 番手・メーカー・商品名"
        >

        <button
            class="primary"
            onclick="openAddModal()"
        >
            ＋追加
        </button>

    </div>

    <div
        id="clubGrid"
        class="club-grid"
    ></div>

</div>


<!-- =========================
     詳細
========================= -->

<div
    id="detailModal"
    class="detail-modal"
>

    <div class="detail-content">

        <div class="detail-header">

            <button
                class="secondary"
                onclick="closeDetail()"
            >
                ← 戻る
            </button>

            <h2>クラブ詳細</h2>

            <button
                id="detailEditButton"
                class="edit-top-button"
            >
                編集
            </button>

        </div>

        <div id="detailContent"></div>

    </div>

</div>


<!-- =========================
     編集
========================= -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">

        <h2 id="modalTitle">
            新しいクラブ
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>番手</label>

                <select id="clubType">

                    <option>1W</option>
                    <option>2W</option>
                    <option>3W</option>
                    <option>4W</option>
                    <option>5W</option>
                    <option>7W</option>
                    <option>9W</option>

                    <option>2U</option>
                    <option>3U</option>
                    <option>4U</option>
                    <option>5U</option>
                    <option>6U</option>

                    <option>1I</option>
                    <option>2I</option>
                    <option>3I</option>
                    <option>4I</option>
                    <option>5I</option>
                    <option>6I</option>
                    <option>7I</option>
                    <option>8I</option>
                    <option>9I</option>

                    <option>PW</option>
                    <option>AW</option>
                    <option>SW</option>
                    <option>LW</option>

                    <option>チッパー</option>
                    <option>パター</option>
                    <option>その他</option>

                </select>

            </div>


            <div class="form-group">

                <label>メーカー</label>

                <input
                    id="maker"
                    placeholder="例：TaylorMade"
                >

            </div>


            <div class="form-group full">

                <label>商品名</label>

                <input
                    id="name"
                    placeholder="例：Qi35"
                >

            </div>


            <!-- 飛距離 -->

            <div class="form-group">

                <label>総飛距離</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openDistancePicker('distance')"
                    id="distanceButton"
                >
                    選択してください
                </button>

            </div>


            <div class="form-group">

                <label>キャリー</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openDistancePicker('carry')"
                    id="carryButton"
                >
                    選択してください
                </button>

            </div>


            <!-- クラブ重量 -->

            <div class="form-group">

                <label>クラブ重量</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('clubWeight','クラブ重量','g')"
                    id="clubWeightButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- クラブ長さ -->

            <div class="form-group">

                <label>クラブ長さ</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('clubLength','クラブ長さ','inch')"
                    id="clubLengthButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- ロフト -->

            <div class="form-group">

                <label>ロフト角</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('loft','ロフト角','°')"
                    id="loftButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- ライ -->

            <div class="form-group">

                <label>ライ角</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('lieAngle','ライ角','°')"
                    id="lieAngleButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- バンス -->

            <div class="form-group">

                <label>バンス角</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('bounce','バンス角','°')"
                    id="bounceButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- シャフト -->

            <div class="form-group">

                <label>シャフト名</label>

                <input
                    id="shaft"
                    placeholder="例：VENTUS TR"
                >

            </div>


            <div class="form-group">

                <label>フレックス</label>

                <select id="flex">

                    <option>R2</option>
                    <option>R</option>
                    <option>SR</option>
                    <option selected>S</option>
                    <option>SX</option>
                    <option>X</option>
                    <option>TX</option>
                    <option>その他</option>

                </select>

            </div>


            <!-- シャフト重量 -->

            <div class="form-group">

                <label>シャフト重量</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('shaftWeight','シャフト重量','g')"
                    id="shaftWeightButton"
                >
                    数字キーで入力
                </button>

            </div>


            <!-- シャフト長さ -->

            <div class="form-group">

                <label>シャフト長さ</label>

                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('shaftLength','シャフト長さ','inch')"
                    id="shaftLengthButton"
                >
                    数字キーで入力
                </button>

            </div>


            <div class="form-group">

                <label>キックポイント</label>

                <select id="kickPoint">

                    <option>元調子</option>
                    <option>中元調子</option>
                    <option selected>中調子</option>
                    <option>先中調子</option>
                    <option>先調子</option>
                    <option>その他</option>

                </select>

            </div>


            <div class="form-group">

                <label>グリップ交換日</label>

                <input
                    id="gripDate"
                    type="date"
                >

            </div>


            <div class="form-group full">

                <label>クラブ写真</label>

                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >

                <img
                    id="preview"
                    class="preview"
                    style="display:none;"
                >

            </div>


            <div class="form-group full">

                <label>メモ</label>

                <textarea
                    id="memo"
                    rows="4"
                    placeholder="クラブについてのメモ"
                ></textarea>

            </div>

        </div>


        <div class="modal-actions">

            <button
                class="secondary"
                onclick="closeModal()"
            >
                キャンセル
            </button>

            <button
                class="primary"
                onclick="saveClub()"
            >
                保存
            </button>

        </div>


        <div
            id="deleteArea"
            class="delete-area"
            style="display:none;"
        >

            <button
                class="danger"
                onclick="deleteCurrentClub()"
            >
                🗑️ このクラブを削除
            </button>

        </div>

    </div>

</div>


<!-- =========================
     距離選択
========================= -->

<div
    id="distancePicker"
    class="choice-panel"
>

    <div class="choice-box">

        <h3 id="distancePickerTitle">
            飛距離を選択
        </h3>

        <div
            id="distanceChoices"
            class="choice-grid"
        ></div>

        <button
            class="secondary"
            style="width:100%;margin-top:10px;"
            onclick="closePicker('distancePicker')"
        >
            キャンセル
        </button>

    </div>

</div>


<!-- =========================
     数字キー
========================= -->

<div
    id="numberPicker"
    class="choice-panel"
>

    <div class="choice-box">

        <h3 id="numberPickerTitle">
            数字を入力
        </h3>

        <div
            id="numberPreview"
            class="unit-preview"
        >
            0
        </div>

        <div class="keypad">

            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>

            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>

            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>

            <button class="key" onclick="pressKey('.')">.</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key" onclick="backspaceKey()">⌫</button>

            <button
                class="key key-wide"
                onclick="clearNumber()"
            >
                クリア
            </button>

            <button
                class="key key-ok"
                onclick="confirmNumber()"
            >
                決定
            </button>

        </div>

        <button
            class="secondary"
            style="width:100%;margin-top:10px;"
            onclick="closePicker('numberPicker')"
        >
            キャンセル
        </button>

    </div>

</div>


<script>

/* =====================================================
   データ
===================================================== */

let clubs = [];

let editingId = null;

let currentPhoto = null;

const STORAGE_KEY =
    "golfClubManagerData";

let currentNumberField = null;
let currentNumberUnit = "";
let currentNumberValue = "";


/* =====================================================
   番手の並び順
===================================================== */

const clubOrder = {

    "1W": 10,
    "2W": 20,
    "3W": 30,
    "4W": 40,
    "5W": 50,
    "7W": 60,
    "9W": 70,

    "2U": 80,
    "3U": 90,
    "4U": 100,
    "5U": 110,
    "6U": 120,

    "1I": 130,
    "2I": 140,
    "3I": 150,
    "4I": 160,
    "5I": 170,
    "6I": 180,
    "7I": 190,
    "8I": 200,
    "9I": 210,

    "PW": 220,
    "AW": 230,
    "SW": 240,
    "LW": 250,

    "チッパー": 260,
    "パター": 270,
    "その他": 999
};


/* =====================================================
   番手順で並び替え
===================================================== */

function sortClubs(list) {

    return [...list].sort((a, b) => {

        const aOrder =
            clubOrder[a.clubType] ?? 500;

        const bOrder =
            clubOrder[b.clubType] ?? 500;

        if (aOrder !== bOrder) {
            return aOrder - bOrder;
        }

        return String(a.name || "")
            .localeCompare(
                String(b.name || ""),
                "ja"
            );
    });
}


/* =====================================================
   保存
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}


/* =====================================================
   読み込み
===================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (saved) {

        try {

            clubs =
                JSON.parse(saved);

        } catch {

            clubs = [];

        }

    }

    renderClubs();
}


/* =====================================================
   一覧表示
===================================================== */

function renderClubs() {

    const grid =
        document.getElementById(
            "clubGrid"
        );

    const keyword =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let filtered =
        clubs.filter(club => {

            const text = [

                club.clubType,
                club.maker,
                club.name,
                club.shaft

            ]
            .join(" ")
            .toLowerCase();

            return text.includes(keyword);
        });


    /* 番手順 */

    filtered =
        sortClubs(filtered);


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                <div style="font-size:40px;">
                    ⛳
                </div>

                <h3>
                    クラブがありません
                </h3>

                <p>
                    「＋追加」からクラブを登録してください。
                </p>

            </div>

        `;

        return;
    }


    grid.innerHTML =
        filtered.map(club => {

            const photo =
                club.photo

                ? `
                    <img
                        class="club-photo"
                        src="${club.photo}"
                    >
                  `

                : `
                    <div class="no-photo">
                        ⛳
                    </div>
                  `;


            return `

                <div
                    class="club-card"
                    onclick="openDetail('${club.id}')"
                >

                    ${photo}


                    <div class="card-body">


                        <div class="club-main">

                            <div class="club-type">

                                ${escapeHTML(
                                    club.clubType || "-"
                                )}

                            </div>

                            <div class="maker">

                                ${escapeHTML(
                                    club.maker ||
                                    "メーカー未入力"
                                )}

                            </div>

                            <div class="name">

                                ${escapeHTML(
                                    club.name ||
                                    "商品名未入力"
                                )}

                            </div>

                        </div>


                        <div class="distance">

                            <div class="distance-box">

                                <small>
                                    飛距離
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        club.distance || "-"
                                    )}
                                </strong>

                            </div>


                            <div class="distance-box">

                                <small>
                                    キャリー
                                </small>

                                <strong>
                                    ${escapeHTML(
                                        club.carry || "-"
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div class="card-mini-info">

                            ${
                                club.clubWeight
                                ? `
                                    <span class="mini-label">
                                        重量
                                    </span>
                                    ${escapeHTML(
                                        club.clubWeight
                                    )}
                                  `
                                : ""
                            }

                            ${
                                club.clubLength
                                ? `
                                    <br>
                                    <span class="mini-label">
                                        長さ
                                    </span>
                                    ${escapeHTML(
                                        club.clubLength
                                    )}
                                  `
                                : ""
                            }

                        </div>


                    </div>

                </div>

            `;

        }).join("");
}


/* =====================================================

function detailSpec(
    title,
    value
) {

            <small>

            </small>

                ${escapeHTML(

                )}
            </strong>

function closeDetail() {

    document.getElementById(
        "detailModal"
    ).style.display =
        "none";
}


/* =====================================================
   新規追加
===================================================== */

function openAddModal() {

    editingId = null;

    currentPhoto = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "新しいクラブ";


    document.getElementById(
        "deleteArea"
    ).style.display =
        "none";


    clearForm();


    document.getElementById(
        "modal"
    ).style.display =
        "block";
}


/* =====================================================
   編集
===================================================== */

function openEditModal(id) {

    const club =
        clubs.find(
            c => c.id === id
        );

    if (!club) return;


    editingId = id;

    currentPhoto =
        club.photo || null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "クラブを編集";


    document.getElementById(
        "deleteArea"
    ).style.display =
        "block";


    document.getElementById(
        "clubType"
    ).value =
        club.clubType || "1W";


    document.getElementById(
        "maker"
    ).value =
        club.maker || "";


    document.getElementById(
        "name"
    ).value =
        club.name || "";


    document.getElementById(
        "shaft"
    ).value =
        club.shaft || "";


    document.getElementById(
        "flex"
    ).value =
        club.flex || "S";


    document.getElementById(
        "kickPoint"
    ).value =
        club.kickPoint || "中調子";


    document.getElementById(
        "gripDate"
    ).value =
        club.gripDate || "";


    document.getElementById(
        "memo"
    ).value =
        club.memo || "";


    setButtonValue(
        "distanceButton",
        club.distance,
        "選択してください"
    );

    setButtonValue(
        "carryButton",
        club.carry,
        "選択してください"
    );

    setButtonValue(
        "clubWeightButton",
        club.clubWeight,
        "数字キーで入力"
    );

    setButtonValue(
        "clubLengthButton",
        club.clubLength,
        "数字キーで入力"
    );

    setButtonValue(
        "loftButton",
        club.loft,
        "数字キーで入力"
    );

    setButtonValue(
        "lieAngleButton",
        club.lieAngle,
        "数字キーで入力"
    );

    setButtonValue(
        "bounceButton",
        club.bounce,
        "数字キーで入力"
    );

    setButtonValue(
        "shaftWeightButton",
        club.shaftWeight,
        "数字キーで入力"
    );

    setButtonValue(
        "shaftLengthButton",
        club.shaftLength,
        "数字キーで入力"
    );


    const preview =
        document.getElementById(
            "preview"
        );


    if (currentPhoto) {

        preview.src =
            currentPhoto;

        preview.style.display =

    } else {

        preview.style.display =

    }

        "photo"
    ).value = "";

    ).style.display =

function setButtonValue(
    id,
    value,
    emptyText
) {

    document.getElementById(
        id
    ).textContent =
        value || emptyText;
}


/* =====================================================
   フォーム初期化
===================================================== */

        "1W";

    document.getElementById(
        "maker"
    ).value =
        "";

    document.getElementById(
        "name"
    ).value =
        "";

    document.getElementById(
        "shaft"
    ).value =
        "";

    document.getElementById(
        "flex"
    ).value =
        "S";

    document.getElementById(
        "kickPoint"
    ).value =

    document.getElementById(

/* =====================================================
   保存
===================================================== */

function saveClub() {

    const data = {

        clubType:
            document.getElementById(
                "clubType"
            ).value,

        maker:
            document.getElementById(
                "maker"
            ).value,

        name:
            document.getElementById(
                "name"
            ).value,

        distance:
            getButtonValue(
                "distanceButton"
            ),

        carry:
            getButtonValue(
                "carryButton"
            ),

        clubWeight:
            getButtonValue(
                "clubWeightButton"
            ),

        clubLength:
            getButtonValue(
                "clubLengthButton"
            ),

        loft:
            getButtonValue(
                "loftButton"
            ),

        lieAngle:
            getButtonValue(
                "lieAngleButton"
            ),

        bounce:
            getButtonValue(
                "bounceButton"
            ),

        shaft:
            document.getElementById(
                "shaft"
            ).value,

        flex:
            document.getElementById(
                "flex"
            ).value,

        shaftWeight:
            getButtonValue(
                "shaftWeightButton"
            ),

        shaftLength:
            getButtonValue(
                "shaftLengthButton"
            ),

        kickPoint:
            document.getElementById(
                "kickPoint"
            ).value,

        gripDate:
            document.getElementById(
                "gripDate"
            ).value,

        memo:
            document.getElementById(
                "memo"
            ).value,

        photo:
            currentPhoto

    };


    if (editingId) {

        const index =
            clubs.findIndex(
                c => c.id === editingId
            );

        if (index !== -1) {

            clubs[index] = {

                ...clubs[index],

                ...data

            };

        }

    } else {

        clubs.push({

            id:
                Date.now().toString(),

            ...data

        });

    }


    saveData();

    renderClubs();

    closeModal();
}


/* =====================================================
   ボタン値取得
===================================================== */

function getButtonValue(id) {

    const value =
        document.getElementById(
            id
        ).textContent;


    if (
        value === "選択してください" ||
        value === "数字キーで入力"
    ) {

        return "";

    }


    return value;
}


/* =====================================================
   写真
===================================================== */

document.getElementById(
    "photo"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                currentPhoto =
                    e.target.result;


                const preview =
                    document.getElementById(
                        "preview"
                    );


                preview.src =
                    currentPhoto;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   距離選択
   50〜350yd
   5yd刻み
===================================================== */

function openDistancePicker(field) {

    document.getElementById(
        "distancePickerTitle"
    ).textContent =

        field === "distance"
        ? "総飛距離を選択"
        : "キャリーを選択";


    const choices =
        document.getElementById(
            "distanceChoices"
        );


    let html = "";


    for (
        let i = 50;
        i <= 350;
        i += 5
    ) {

        html += `

            <button
                class="choice-button"
                onclick="selectDistance(
                    '${field}',
                    '${i} yd'
                )"
            >
                ${i} yd
            </button>

        `;

    }


    choices.innerHTML =
        html;


    document.getElementById(
        "distancePicker"
    ).style.display =
        "flex";
}


function selectDistance(
    field,
    value
) {

    document.getElementById(
        field + "Button"
    ).textContent =
        value;


    closePicker(
        "distancePicker"
    );
}


/* =====================================================
   数字キー
===================================================== */

function openNumberPicker(
    field,
    title,
    unit
) {

    currentNumberField =
        field;

    currentNumberUnit =
        unit;


    const button =
        document.getElementById(
            field + "Button"
        );


    let existing =
        button.textContent;


    if (
        existing === "数字キーで入力" ||
        existing === "選択してください"
    ) {

        currentNumberValue =
            "";

    } else {

        currentNumberValue =
            existing
                .replace(unit, "")
                .trim();

    }


    document.getElementById(
        "numberPickerTitle"
    ).textContent =
        title;


    updateNumberPreview();


    document.getElementById(
        "numberPicker"
    ).style.display =
        "flex";
}


function updateNumberPreview() {

    document.getElementById(
        "numberPreview"
    ).textContent =

        (currentNumberValue || "0")
        + " "
        + currentNumberUnit;
}


function pressKey(value) {

    if (value === ".") {

        if (
            currentNumberValue
                .includes(".")
        ) {

            return;

        }


        if (
            currentNumberValue === ""
        ) {

            currentNumberValue =
                "0";

        }

    }


    currentNumberValue +=
        value;


    updateNumberPreview();
}


function backspaceKey() {

    currentNumberValue =
        currentNumberValue.slice(
            0,
            -1
        );


    updateNumberPreview();
}


function clearNumber() {

    currentNumberValue =
        "";

    updateNumberPreview();
}


function confirmNumber() {

    if (
        currentNumberValue === ""
    ) {

        closePicker(
            "numberPicker"
        );

        return;
    }


    document.getElementById(
        currentNumberField + "Button"
    ).textContent =

        currentNumberValue
        + " "
        + currentNumberUnit;


    closePicker(
        "numberPicker"
    );
}


/* =====================================================
   ピッカー閉じる
===================================================== */

function closePicker(id) {

    document.getElementById(
        id
    ).style.display =
        "none";
}


/* =====================================================
   編集画面閉じる
===================================================== */

function closeModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";
}


/* =====================================================
   削除
===================================================== */

function deleteCurrentClub() {

    if (!editingId) return;


    const club =
        clubs.find(
            c => c.id === editingId
        );


    if (!club) return;


    const ok =
        confirm(

            "「" +
            (
                club.name ||
                club.clubType
            ) +
            "」を削除しますか？\n\n" +
            "この操作は元に戻せません。"

        );


    if (!ok) return;


    clubs =
        clubs.filter(
            c => c.id !== editingId
        );


    saveData();

    renderClubs();

    closeModal();
}


/* =====================================================
   検索
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    renderClubs
);


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================================================
   起動
===================================================== */

loadData();

</script>
