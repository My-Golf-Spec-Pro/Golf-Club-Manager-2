<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:#f4f6f5;
    color:#222;
}
/* =========================
   ヘッダー
========================= */
header{
    background:#126b3a;
    color:white;
    padding:11px 14px;
}
header h1{
    margin:0;
    font-size:18px;
}
header p{
    margin:3px 0 0;
    font-size:11px;
    opacity:.85;
}
/* =========================
   コンテナ
========================= */
.container{
    max-width:1200px;
    margin:auto;
    padding:8px;
}
/* =========================
   検索・追加
========================= */
.toolbar{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}
.toolbar .search{
    flex:1;
    min-width:0;
}
.toolbar .primary{
    flex:0 0 82px;
    white-space:nowrap;
    padding-left:8px;
    padding-right:8px;
}
/* =========================
   共通入力
========================= */
input,
select,
textarea,
button{
    font:inherit;
}
input,
select,
textarea{
    width:100%;
    padding:9px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
}
button{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
}
.primary{
    background:#126b3a;
    color:white;
}
.secondary{
    background:#e5e9e7;
}
.danger{
    background:#d9363e;
    color:white;
}
/* =========================
   一覧項目名
========================= */
.club-list-header{
    display:grid;
    /*
       写真 / 番手 / メーカー / 商品名 / 飛距離 / キャリー
    */
    grid-template-columns:
        88px
        70px
        minmax(120px,1fr)
        minmax(140px,1.15fr)
        105px
        105px;
    gap:8px;
    align-items:center;
    padding:0 9px 5px;
    color:#666;
    font-size:11px;
    font-weight:800;
}
.club-list-header > div{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================
   クラブ一覧
========================= */
.club-grid{
    display:flex;
    flex-direction:column;
    gap:6px;
}
/* =========================
   クラブカード
========================= */
.club-card{
    display:grid;
    grid-template-columns:
        88px
        70px
        minmax(120px,1fr)
        minmax(140px,1.15fr)
        105px
        105px;
    gap:8px;
    align-items:center;
    background:white;
    border-radius:9px;
    padding:6px 9px;
    box-shadow:0 2px 7px rgba(0,0,0,.08);
    cursor:pointer;
    min-width:0;
}
.club-card:active{
    transform:scale(.99);
}
/* =========================
   写真
========================= */
.club-photo,
.no-photo{
    width:88px;
    height:58px;
    border-radius:6px;
    overflow:hidden;
}
.club-photo{
    object-fit:cover;
    background:#e9eceb;
}
.no-photo{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e9eceb;
    color:#777;
    font-size:25px;
}
/* =========================
   番手
========================= */
.club-type{
    min-width:0;
    color:#126b3a;
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================
   メーカー
========================= */
.maker{
    min-width:0;
    color:#333;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================
   商品名
========================= */
.name{
    min-width:0;
    color:#333;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================
   飛距離・キャリー
========================= */
.list-distance{
    min-width:0;
    color:#222;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/*
   ヤード表示だけを1行にする
   例：250 yd
*/
.list-distance span{
    white-space:nowrap;
}
/* =========================
   空一覧
========================= */
.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}
/* =========================
   詳細画面
========================= */
.detail-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:20;
    overflow-y:auto;
    padding:8px;
}
.detail-content{
    max-width:650px;
    margin:4px auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
}
.detail-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:white;
    z-index:2;
}
.detail-header h2{
    margin:0;
    font-size:18px;
    white-space:nowrap;
}
.edit-top-button{
    background:#126b3a;
    color:white;
    padding:8px 13px;
    white-space:nowrap;
}
.detail-photo{
    width:100%;
    max-height:300px;
    object-fit:contain;
    background:#eee;
}
.detail-no-photo{
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9eceb;
    font-size:60px;
}
.detail-body{
    padding:15px;
}
.detail-title{
    color:#126b3a;
    font-size:30px;
    font-weight:900;
}
.detail-maker{
    color:#777;
    margin-top:3px;
    font-size:14px;
}
.detail-name{
    font-size:21px;
    font-weight:800;
    margin:5px 0 15px;
}
.detail-distance{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:16px;
}
.big-distance{
    background:#edf7f1;
    border-radius:10px;
    padding:12px;
    text-align:center;
}
.big-distance small{
    display:block;
    color:#666;
}
.big-distance strong{
    display:block;
    color:#126b3a;
    font-size:23px;
    margin-top:3px;
}
/* =========================
   スペック見出し
========================= */
.spec-section-title{
    margin:18px 0 8px;
    padding:8px 10px;
    background:#126b3a;
    color:white;
    border-radius:8px;
    font-size:15px;
    font-weight:800;
}
/* =========================
   スペック
========================= */
.detail-specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}
.detail-spec{
    background:#f5f6f6;
    border-radius:8px;
    padding:9px;
    min-width:0;
}
.detail-spec small{
    display:block;
    color:#777;
    font-size:11px;
}
.detail-spec strong{
    display:block;
    margin-top:2px;
    font-size:14px;
    word-break:break-word;
}
/* =========================
   詳細メモ
========================= */
.detail-memo{
    background:#fffbe8;
    padding:12px;
    border-radius:9px;
    margin-top:14px;
    white-space:pre-wrap;
    text-align:left;
    line-height:1.6;
    word-break:break-word;
    display:block;
    width:100%;
}
/* =========================
   編集画面
========================= */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:30;
    overflow-y:auto;
    padding:8px;
}
.modal-content{
    max-width:700px;
    margin:4px auto;
    background:white;
    border-radius:15px;
    padding:15px;
}
.modal h2{
    margin:0 0 15px;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.form-group{
    margin-bottom:8px;
}
.form-group label{
    display:block;
    font-size:12px;
    color:#555;
    margin-bottom:4px;
}
.full{
    grid-column:1/-1;
}
.preview{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border-radius:9px;
    margin-top:8px;
}
.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}
.modal-actions button{
    flex:1;
}
.delete-area{
    margin-top:22px;
    padding-top:15px;
    border-top:1px solid #ddd;
}
.delete-area button{
    width:100%;
}
/* =========================
   選択パネル
========================= */
.choice-panel{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:50;
    align-items:flex-end;
    justify-content:center;
}
.choice-box{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:18px 18px 0 0;
    padding:15px;
    max-height:75vh;
    overflow-y:auto;
}
.choice-box h3{
    margin:0 0 12px;
    text-align:center;
}
.choice-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}
.choice-button{
    background:#edf7f1;
    color:#126b3a;
    font-weight:700;
    padding:11px 4px;
}
.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}
.key{
    background:#f0f2f1;
    font-size:20px;
    font-weight:700;
    padding:15px;
}
.key-wide{
    grid-column:span 2;
}
.key-ok{
    background:#126b3a;
    color:white;
}
.unit-preview{
    text-align:center;
    background:#f5f6f6;
    border-radius:10px;
    padding:12px;
    font-size:25px;
    font-weight:800;
    margin-bottom:10px;
}
/* =========================
   スマホ
========================= */
@media(max-width:600px){
    .container{
        padding:6px;
    }
    /*
       iPhoneでも1列。
       10本程度を縦に見やすくする。
    */
    .club-list-header{
        grid-template-columns:
            62px
            55px
            minmax(75px,1fr)
            minmax(85px,1.05fr)
            63px
            63px;
        gap:5px;
        padding:0 6px 4px;
        font-size:9px;
    }
    .club-card{
        grid-template-columns:
            62px
            55px
            minmax(75px,1fr)
            minmax(85px,1.05fr)
            63px
            63px;
        gap:5px;
        padding:5px 6px;
        min-height:58px;
    }
    .club-photo,
    .no-photo{
        width:62px;
        height:48px;
    }
    .club-type{
        font-size:15px;
        /*
           パター・チッパーなども
           番手欄の中だけで省略
        */
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .maker,
    .name,
    .list-distance{
        font-size:12px;
        font-weight:700;
    }
    .list-distance{
        font-weight:800;
    }
    .toolbar .primary{
        flex:0 0 82px;
        font-size:14px;
        padding-left:6px;
        padding-right:6px;
    }
    .form-grid{
        grid-template-columns:1fr;
    }
    .full{
        grid-column:auto;
    }
    .detail-specs{
        grid-template-columns:1fr 1fr;
    }
    .detail-distance{
        grid-template-columns:1fr 1fr;
    }
    .detail-title{
        font-size:28px;
    }
}
/* =========================
   さらに小さいiPhone
========================= */
@media(max-width:390px){
    .club-list-header{
        grid-template-columns:
            56px
            49px
            minmax(68px,1fr)
            minmax(76px,1.05fr)
            58px
            58px;
        gap:4px;
        font-size:8px;
    }
    .club-card{
        grid-template-columns:
            56px
            49px
            minmax(68px,1fr)
            minmax(76px,1.05fr)
            58px
            58px;
        gap:4px;
        padding:4px 5px;
    }
    .club-photo,
    .no-photo{
        width:56px;
        height:44px;
    }
    .club-type{
        font-size:14px;
    }
    .maker,
    .name,
    .list-distance{
        font-size:11px;
    }
    .toolbar .primary{
        flex-basis:78px;
        font-size:13px;
    }
}
</style>
</head>
<body>
<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>
<div class="container">
    <!-- =========================
         検索・追加
    ========================= -->
    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 番手・メーカー・商品名"
        >
        <button
            class="primary"
            onclick="openAddModal()"
        >
            ＋追加
        </button>
    </div>
    <!-- =========================
         一覧項目
    ========================= -->
    <div class="club-list-header">
        <div>写真</div>
        <div>番手</div>
        <div>メーカー</div>
        <div>商品名</div>
        <div>飛距離</div>
        <div>キャリー</div>
    </div>
    <!-- =========================
         一覧
    ========================= -->
    <div
        id="clubGrid"
        class="club-grid"
    ></div>
</div>
<!-- =====================================================
     詳細画面
===================================================== -->
<div
    id="detailModal"
    class="detail-modal"
>
    <div class="detail-content">
        <div class="detail-header">
            <button
                class="secondary"
                onclick="closeDetail()"
            >
                ← 戻る
            </button>
            <h2>クラブ詳細</h2>
            <button
                id="detailEditButton"
                class="edit-top-button"
            >
                編集
            </button>
        </div>
        <div id="detailContent"></div>
    </div>
</div>
<!-- =====================================================
     編集画面
===================================================== -->
<div
    id="modal"
    class="modal"
>
    <div class="modal-content">
        <h2 id="modalTitle">
            新しいクラブ
        </h2>
        <div class="form-grid">
            <!-- 番手 -->
            <div class="form-group">
                <label>番手</label>
                <select id="clubType">
                    <option>1W</option>
                    <option>2W</option>
                    <option>3W</option>
                    <option>4W</option>
                    <option>5W</option>
                    <option>7W</option>
                    <option>9W</option>
                    <option>2U</option>
                    <option>3U</option>
                    <option>4U</option>
                    <option>5U</option>
                    <option>6U</option>
                    <option>1I</option>
                    <option>2I</option>
                    <option>3I</option>
                    <option>4I</option>
                    <option>5I</option>
                    <option>6I</option>
                    <option>7I</option>
                    <option>8I</option>
                    <option>9I</option>
                    <option>PW</option>
                    <option>AW</option>
                    <option>SW</option>
                    <option>LW</option>
                    <option>チッパー</option>
                    <option>パター</option>
                    <option>その他</option>
                </select>
            </div>
            <!-- メーカー -->
            <div class="form-group">
                <label>メーカー</label>
                <input
                    id="maker"
                    placeholder="例：TaylorMade"
                >
            </div>
            <!-- 商品名 -->
            <div class="form-group full">
                <label>商品名</label>
                <input
                    id="name"
                    placeholder="例：Qi35"
                >
            </div>
            <!-- 総飛距離 -->
            <div class="form-group">
                <label>総飛距離</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openDistancePicker('distance')"
                    id="distanceButton"
                >
                    選択してください
                </button>
            </div>
            <!-- キャリー -->
            <div class="form-group">
                <label>キャリー</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openDistancePicker('carry')"
                    id="carryButton"
                >
                    選択してください
                </button>
            </div>
            <!-- クラブ重量 -->
            <div class="form-group">
                <label>クラブ重量</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('clubWeight','クラブ重量','g')"
                    id="clubWeightButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- クラブ長さ -->
            <div class="form-group">
                <label>クラブ長さ</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('clubLength','クラブ長さ','inch')"
                    id="clubLengthButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- ロフト角 -->
            <div class="form-group">
                <label>ロフト角</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('loft','ロフト角','°')"
                    id="loftButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- ライ角 -->
            <div class="form-group">
                <label>ライ角</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('lieAngle','ライ角','°')"
                    id="lieAngleButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- バンス角 -->
            <div class="form-group">
                <label>バンス角</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('bounce','バンス角','°')"
                    id="bounceButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- シャフト名 -->
            <div class="form-group">
                <label>シャフト名</label>
                <input
                    id="shaft"
                    placeholder="例：VENTUS TR"
                >
            </div>
            <!-- フレックス -->
            <div class="form-group">
                <label>フレックス</label>
                <select id="flex">
                    <option>R2</option>
                    <option>R</option>
                    <option>SR</option>
                    <option selected>S</option>
                    <option>SX</option>
                    <option>X</option>
                    <option>TX</option>
                    <option>その他</option>
                </select>
            </div>
            <!-- シャフト重量 -->
            <div class="form-group">
                <label>シャフト重量</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('shaftWeight','シャフト重量','g')"
                    id="shaftWeightButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- シャフト長さ -->
            <div class="form-group">
                <label>シャフト長さ</label>
                <button
                    type="button"
                    class="secondary"
                    style="width:100%;"
                    onclick="openNumberPicker('shaftLength','シャフト長さ','inch')"
                    id="shaftLengthButton"
                >
                    数字キーで入力
                </button>
            </div>
            <!-- キックポイント -->
            <div class="form-group">
                <label>キックポイント</label>
                <select id="kickPoint">
                    <option>元調子</option>
                    <option>中元調子</option>
                    <option selected>中調子</option>
                    <option>先中調子</option>
                    <option>先調子</option>
                    <option>その他</option>
                </select>
            </div>
            <!-- グリップ交換日 -->
            <div class="form-group">
                <label>グリップ交換日</label>
                <input
                    id="gripDate"
                    type="date"
                >
            </div>
            <!-- 写真 -->
            <div class="form-group full">
                <label>クラブ写真</label>
                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >
                <img
                    id="preview"
                    class="preview"
                    style="display:none;"
                >
            </div>
            <!-- メモ -->
            <div class="form-group full">
                <label>メモ</label>
                <textarea
                    id="memo"
                    rows="4"
                    placeholder="クラブについてのメモ"
                ></textarea>
            </div>
        </div>
        <!-- 保存・キャンセル -->
        <div class="modal-actions">
            <button
                class="secondary"
                onclick="closeModal()"
            >
                キャンセル
            </button>
            <button
                class="primary"
                onclick="saveClub()"
            >
                保存
            </button>
        </div>
        <!-- 削除 -->
        <div
            id="deleteArea"
            class="delete-area"
            style="display:none;"
        >
            <button
                class="danger"
                onclick="deleteCurrentClub()"
            >
                🗑️ このクラブを削除
            </button>
        </div>
    </div>
</div>
<!-- =====================================================
     距離選択
===================================================== -->
<div
    id="distancePicker"
    class="choice-panel"
>
    <div class="choice-box">
        <h3 id="distancePickerTitle">
            飛距離を選択
        </h3>
        <div
            id="distanceChoices"
            class="choice-grid"
        ></div>
        <button
            class="secondary"
            style="width:100%;margin-top:10px;"
            onclick="closePicker('distancePicker')"
        >
            キャンセル
        </button>
    </div>
</div>
<!-- =====================================================
     数字キー
===================================================== -->
<div
    id="numberPicker"
    class="choice-panel"
>
    <div class="choice-box">
        <h3 id="numberPickerTitle">
            数字を入力
        </h3>
        <div
            id="numberPreview"
            class="unit-preview"
        >
            0
        </div>
        <div class="keypad">
            <button
                class="key"
                onclick="pressKey('1')"
            >
                1
            </button>
            <button
                class="key"
                onclick="pressKey('2')"
            >
                2
            </button>
            <button
                class="key"
                onclick="pressKey('3')"
            >
                3
            </button>
            <button
                class="key"
                onclick="pressKey('4')"
            >
                4
            </button>
            <button
                class="key"
                onclick="pressKey('5')"
            >
                5
            </button>
            <button
                class="key"
                onclick="pressKey('6')"
            >
                6
            </button>
            <button
                class="key"
                onclick="pressKey('7')"
            >
                7
            </button>
            <button
                class="key"
                onclick="pressKey('8')"
            >
                8
            </button>
            <button
                class="key"
                onclick="pressKey('9')"
            >
                9
            </button>
            <button
                class="key"
                onclick="pressKey('.')"
            >
                .
            </button>
            <button
                class="key"
                onclick="pressKey('0')"
            >
                0
            </button>
            <button
                class="key"
                onclick="backspaceKey()"
            >
                ⌫
            </button>
            <button
                class="key key-wide"
                onclick="clearNumber()"
            >
                クリア
            </button>
            <button
                class="key key-ok"
                onclick="confirmNumber()"
            >
                決定
            </button>
        </div>
        <button
            class="secondary"
            style="width:100%;margin-top:10px;"
            onclick="closePicker('numberPicker')"
        >
            キャンセル
        </button>
    </div>
</div>
<script>
/* =====================================================
   データ
===================================================== */
let clubs=[];
let editingId=null;
let currentPhoto=null;
const STORAGE_KEY="golfClubManagerData";
let currentNumberField=null;
let currentNumberUnit="";
let currentNumberValue="";
/* =====================================================
   番手の並び順
===================================================== */
const clubOrder=[
    "1W",
    "2W",
    "3W",
    "4W",
    "5W",
    "7W",
    "9W",
    "2U",
    "3U",
    "4U",
    "5U",
    "6U",
    "1I",
    "2I",
    "3I",
    "4I",
    "5I",
    "6I",
    "7I",
    "8I",
    "9I",
    "PW",
    "AW",
    "SW",
    "LW",
    "チッパー",
    "パター",
    "その他"
];
function getClubOrder(type){
    const index=clubOrder.indexOf(type);
    return index===-1
        ?999
        :index;
}
/* =====================================================
   保存
===================================================== */
function saveData(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}
/* =====================================================
   読み込み
===================================================== */
function loadData(){
    const saved=
        localStorage.getItem(
            STORAGE_KEY
        );
    if(saved){
        try{
            clubs=JSON.parse(saved);
        }catch{
            clubs=[];
        }
    }
    renderClubs();
}
/* =====================================================
   一覧表示
===================================================== */
function renderClubs(){
    const grid=
        document.getElementById(
            "clubGrid"
        );
    const keyword=
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();
    const filtered=
        clubs
        .filter(club=>{
            const text=[
                club.clubType,
                club.maker,
                club.name,
                club.shaft
            ]
            .join(" ")
            .toLowerCase();
            return text.includes(keyword);
        })
        .sort((a,b)=>{
            const orderA=
                getClubOrder(
                    a.clubType
                );
            const orderB=
                getClubOrder(
                    b.clubType
                );
            if(orderA!==orderB){
                return orderA-orderB;
            }
            return(
                (a.maker||"")
            )
            .localeCompare(
                b.maker||"",
                "ja"
            );
        });
    if(filtered.length===0){
        grid.innerHTML=`
            <div class="empty">
                <div
                    style="font-size:40px;"
                >
                    ⛳
                </div>
                <h3>
                    クラブがありません
                </h3>
                <p>
                    「＋追加」からクラブを登録してください。
                </p>
            </div>
        `;
        return;
    }
    grid.innerHTML=
        filtered
        .map(club=>{
            const photo=
                club.photo
                ?
                `
                    <img
                        class="club-photo"
                        src="${club.photo}"
                    >
                `
                :
                `
                    <div class="no-photo">
                        ⛳
                    </div>
                `;
            /*
               飛距離は保存値が
               「250 yd」ならそのまま1行。
            */
            return`
                <div
                    class="club-card"
                    onclick="openDetail('${club.id}')"
                >
                    ${photo}
                    <div class="club-type">
                        ${escapeHTML(
                            club.clubType||"-"
                        )}
                    </div>
                    <div class="maker">
                        ${escapeHTML(
                            club.maker||
                            "メーカー未入力"
                        )}
                    </div>
                    <div class="name">
                        ${escapeHTML(
                            club.name||
                            "商品名未入力"
                        )}
                    </div>
                    <div class="list-distance">
                        <span>
                            ${escapeHTML(
                                club.distance||"-"
                            )}
                        </span>
                    </div>
                    <div class="list-distance">
                        <span>
                            ${escapeHTML(
                                club.carry||"-"
                            )}
                        </span>
                    </div>
                </div>
            `;
        })
        .join("");
}
/* =====================================================
   詳細画面
===================================================== */
function openDetail(id){
    const club=
        clubs.find(
            c=>c.id===id
        );
    if(!club)return;
    const content=
        document.getElementById(
            "detailContent"
        );
    const photo=
        club.photo
        ?
        `
            <img
                class="detail-photo"
                src="${club.photo}"
            >
        `
        :
        `
            <div class="detail-no-photo">
                ⛳
            </div>
        `;
    content.innerHTML=`
        ${photo}
        <div class="detail-body">
            <div class="detail-title">
                ${escapeHTML(
                    club.clubType||"-"
                )}
            </div>
            <div class="detail-maker">
                ${escapeHTML(
                    club.maker||
                    "メーカー未入力"
                )}
            </div>
            <div class="detail-name">
                ${escapeHTML(
                    club.name||
                    "商品名未入力"
                )}
            </div>
            <div class="detail-distance">
                <div class="big-distance">
                    <small>
                        総飛距離
                    </small>
                    <strong>
                        ${escapeHTML(
                            club.distance||"-"
                        )}
                    </strong>
                </div>
                <div class="big-distance">
                    <small>
                        キャリー
                    </small>
                    <strong>
                        ${escapeHTML(
                            club.carry||"-"
                        )}
                    </strong>
                </div>
            </div>
            <!-- クラブスペック -->
            <div class="spec-section-title">
                🏌️ クラブスペック
            </div>
            <div class="detail-specs">
                ${detailSpec(
                    "クラブ重量",
                    club.clubWeight
                )}
                ${detailSpec(
                    "クラブ長さ",
                    club.clubLength
                )}
                ${detailSpec(
                    "ロフト角",
                    club.loft
                )}
                ${detailSpec(
                    "ライ角",
                    club.lieAngle
                )}
                ${detailSpec(
                    "バンス角",
                    club.bounce
                )}
                ${detailSpec(
                    "グリップ交換日",
                    club.gripDate
                )}
            </div>
            <!-- シャフトスペック -->
            <div class="spec-section-title">
                🏌️‍♂️ シャフトスペック
            </div>
            <div class="detail-specs">
                ${detailSpec(
                    "シャフト",
                    club.shaft
                )}
                ${detailSpec(
                    "フレックス",
                    club.flex
                )}
                ${detailSpec(
                    "シャフト重量",
                    club.shaftWeight
                )}
                ${detailSpec(
                    "シャフト長さ",
                    club.shaftLength
                )}
                ${detailSpec(
                    "キックポイント",
                    club.kickPoint
                )}
            </div>
            ${
                club.memo
                ?
                `
                    <div class="detail-memo">${escapeHTML(club.memo)}</div>
                `
                :
                ""
            }
        </div>
    `;
    document.getElementById(
        "detailEditButton"
    ).onclick=function(){
        closeDetail();
        setTimeout(()=>{
            openEditModal(id);
        },100);
    };
    document.getElementById(
        "detailModal"
    ).style.display="block";
}
function detailSpec(title,value){
    return`
        <div class="detail-spec">
            <small>
                ${escapeHTML(title)}
            </small>
            <strong>
                ${escapeHTML(value||"-")}
            </strong>
        </div>
    `;
}
function closeDetail(){
    document.getElementById(
        "detailModal"
    ).style.display="none";
}
/* =====================================================
   新規追加
===================================================== */
function openAddModal(){
    editingId=null;
    currentPhoto=null;
    document.getElementById(
        "modalTitle"
    ).textContent=
        "新しいクラブ";
    document.getElementById(
        "deleteArea"
    ).style.display=
        "none";
    clearForm();
    document.getElementById(
        "modal"
    ).style.display=
        "block";
}
/* =====================================================
   編集
===================================================== */
function openEditModal(id){
    const club=
        clubs.find(
            c=>c.id===id
        );
    if(!club)return;
    editingId=id;
    currentPhoto=
        club.photo||null;
    document.getElementById(
        "modalTitle"
    ).textContent=
        "クラブを編集";
    document.getElementById(
        "deleteArea"
    ).style.display=
        "block";
    document.getElementById(
        "clubType"
    ).value=
        club.clubType||"1W";
    document.getElementById(
        "maker"
    ).value=
        club.maker||"";
    document.getElementById(
        "name"
    ).value=
        club.name||"";
    document.getElementById(
        "shaft"
    ).value=
        club.shaft||"";
    document.getElementById(
        "flex"
    ).value=
        club.flex||"S";
    document.getElementById(
        "kickPoint"
    ).value=
        club.kickPoint||"中調子";
    document.getElementById(
        "gripDate"
    ).value=
        club.gripDate||"";
    document.getElementById(
        "memo"
    ).value=
        club.memo||"";
    setButtonValue(
        "distanceButton",
        club.distance,
        "選択してください"
    );
    setButtonValue(
        "carryButton",
        club.carry,
        "選択してください"
    );
    setButtonValue(
        "clubWeightButton",
        club.clubWeight,
        "数字キーで入力"
    );
    setButtonValue(
        "clubLengthButton",
        club.clubLength,
        "数字キーで入力"
    );
    setButtonValue(
        "loftButton",
        club.loft,
        "数字キーで入力"
    );
    setButtonValue(
        "lieAngleButton",
        club.lieAngle,
        "数字キーで入力"
    );
    setButtonValue(
        "bounceButton",
        club.bounce,
        "数字キーで入力"
    );
    setButtonValue(
        "shaftWeightButton",
        club.shaftWeight,
        "数字キーで入力"
    );
    setButtonValue(
        "shaftLengthButton",
        club.shaftLength,
        "数字キーで入力"
    );
    const preview=
        document.getElementById(
            "preview"
        );
    if(currentPhoto){
        preview.src=currentPhoto;
        preview.style.display=
            "block";
    }else{
        preview.style.display=
            "none";
    }
    document.getElementById(
        "photo"
    ).value="";
    document.getElementById(
        "modal"
    ).style.display=
        "block";
}
function setButtonValue(
    id,
    value,
    emptyText
){
    document.getElementById(
        id
    ).textContent=
        value||emptyText;
}
/* =====================================================
   フォーム初期化
===================================================== */
function clearForm(){
    document.getElementById(
        "clubType"
    ).value=
        "1W";
    document.getElementById(
        "maker"
    ).value="";
    document.getElementById(
        "name"
    ).value="";
    document.getElementById(
        "shaft"
    ).value="";
    document.getElementById(
        "flex"
    ).value="S";
    document.getElementById(
        "kickPoint"
    ).value=
        "中調子";
    document.getElementById(
        "gripDate"
    ).value="";
    document.getElementById(
        "memo"
    ).value="";
    document.getElementById(
        "photo"
    ).value="";
    const defaults={
        distanceButton:
            "選択してください",
        carryButton:
            "選択してください",
        clubWeightButton:
            "数字キーで入力",
        clubLengthButton:
            "数字キーで入力",
        loftButton:
            "数字キーで入力",
        lieAngleButton:
            "数字キーで入力",
        bounceButton:
            "数字キーで入力",
        shaftWeightButton:
            "数字キーで入力",
        shaftLengthButton:
            "数字キーで入力"
    };
    Object.keys(defaults)
    .forEach(id=>{
        document.getElementById(
            id
        ).textContent=
            defaults[id];
    });
    document.getElementById(
        "preview"
    ).style.display=
        "none";
}
/* =====================================================
   保存
===================================================== */
function saveClub(){
    const data={
        clubType:
            document.getElementById(
                "clubType"
            ).value,
        maker:
            document.getElementById(
                "maker"
            ).value,
        name:
            document.getElementById(
                "name"
            ).value,
        distance:
            getButtonValue(
                "distanceButton"
            ),
        carry:
            getButtonValue(
                "carryButton"
            ),
        clubWeight:
            getButtonValue(
                "clubWeightButton"
            ),
        clubLength:
            getButtonValue(
                "clubLengthButton"
            ),
        loft:
            getButtonValue(
                "loftButton"
            ),
        lieAngle:
            getButtonValue(
                "lieAngleButton"
            ),
        bounce:
            getButtonValue(
                "bounceButton"
            ),
        shaft:
            document.getElementById(
                "shaft"
            ).value,
        flex:
            document.getElementById(
                "flex"
            ).value,
        shaftWeight:
            getButtonValue(
                "shaftWeightButton"
            ),
        shaftLength:
            getButtonValue(
                "shaftLengthButton"
            ),
        kickPoint:
            document.getElementById(
                "kickPoint"
            ).value,
        gripDate:
            document.getElementById(
                "gripDate"
            ).value,
        memo:
            document.getElementById(
                "memo"
            ).value,
        photo:
            currentPhoto
    };
    if(editingId){
        const index=
            clubs.findIndex(
                c=>c.id===editingId
            );
        if(index!==-1){
            clubs[index]={
                ...clubs[index],
                ...data
            };
        }
    }else{
        clubs.push({
            id:
                Date.now().toString(),
            ...data
        });
    }
    saveData();
    renderClubs();
    closeModal();
}
/* =====================================================
   ボタン値取得
===================================================== */
function getButtonValue(id){
    const value=
        document.getElementById(
            id
        ).textContent;
    if(
        value==="選択してください"||
        value==="数字キーで入力"
    ){
        return "";
    }
    return value;
}
/* =====================================================
   写真
===================================================== */
document.getElementById(
    "photo"
)
.addEventListener(
    "change",
    function(event){
        const file=
            event.target.files[0];
        if(!file)return;
        const reader=
            new FileReader();
        reader.onload=function(e){
            currentPhoto=
                e.target.result;
            const preview=
                document.getElementById(
                    "preview"
                );
            preview.src=
                currentPhoto;
            preview.style.display=
                "block";
        };
        reader.readAsDataURL(file);
    }
);
/* =====================================================
   飛距離選択
   5ヤード単位
===================================================== */
function openDistancePicker(field){
    document.getElementById(
        "distancePickerTitle"
    ).textContent=
        field==="distance"
        ?
        "総飛距離を選択"
        :
        "キャリーを選択";
    const choices=
        document.getElementById(
            "distanceChoices"
        );
    let html="";
    for(
        let i=50;
        i<=350;
        i+=5
    ){
        html+=`
            <button
                class="choice-button"
                onclick="selectDistance('${field}','${i} yd')"
            >
                ${i} yd
            </button>
        `;
    }
    choices.innerHTML=
        html;
    document.getElementById(
        "distancePicker"
    ).style.display=
        "flex";
}
function selectDistance(
    field,
    value
){
    document.getElementById(
        field+"Button"
    ).textContent=
        value;
    closePicker(
        "distancePicker"
    );
}
/* =====================================================
   数字キー
===================================================== */
function openNumberPicker(
    field,
    title,
    unit
){
    currentNumberField=
        field;
    currentNumberUnit=
        unit;
    const button=
        document.getElementById(
            field+"Button"
        );
    let existing=
        button.textContent;
    if(
        existing==="数字キーで入力"||
        existing==="選択してください"
    ){
        currentNumberValue="";
    }else{
        currentNumberValue=
            existing
            .replace(unit,"")
            .trim();
    }
    document.getElementById(
        "numberPickerTitle"
    ).textContent=
        title;
    updateNumberPreview();
    document.getElementById(
        "numberPicker"
    ).style.display=
        "flex";
}
function updateNumberPreview(){
    document.getElementById(
        "numberPreview"
    ).textContent=
        (currentNumberValue||"0")
        +
        " "
        +
        currentNumberUnit;
}
function pressKey(value){
    if(value==="."){
        if(
            currentNumberValue
            .includes(".")
        ){
            return;
        }
        if(
            currentNumberValue===""
        ){
            currentNumberValue=
                "0";
        }
    }
    currentNumberValue+=
        value;
    updateNumberPreview();
}
function backspaceKey(){
    currentNumberValue=
        currentNumberValue
        .slice(0,-1);
    updateNumberPreview();
}
function clearNumber(){
    currentNumberValue="";
    updateNumberPreview();
}
function confirmNumber(){
    if(
        currentNumberValue===""
    ){
        closePicker(
            "numberPicker"
        );
        return;
    }
    document.getElementById(
        currentNumberField+"Button"
    ).textContent=
        currentNumberValue
        +
        " "
        +
        currentNumberUnit;
    closePicker(
        "numberPicker"
    );
}
/* =====================================================
   閉じる
===================================================== */
function closePicker(id){
    document.getElementById(
        id
    ).style.display=
        "none";
}
function closeModal(){
    document.getElementById(
        "modal"
    ).style.display=
        "none";
}
/* =====================================================
   削除
===================================================== */
function deleteCurrentClub(){
    if(!editingId)return;
    const club=
        clubs.find(
            c=>c.id===editingId
        );
    if(!club)return;
    const ok=
        confirm(
            "「"
            +
            (club.name||club.clubType)
            +
            "」を削除しますか？\n\n"
            +
            "この操作は元に戻せません。"
        );
    if(!ok)return;
    clubs=
        clubs.filter(
            c=>c.id!==editingId
        );
    saveData();
    renderClubs();
    closeModal();
}
/* =====================================================
   検索
===================================================== */
document.getElementById(
    "search"
)
.addEventListener(
    "input",
    renderClubs
);
/* =====================================================
   HTMLエスケープ
===================================================== */
function escapeHTML(value){
    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}
/* =====================================================
   起動
===================================================== */
loadData();
</script>
</body>
</html>
