<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Club Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f4f6f5;
    color: #222;
}

header {
    background: #126b3a;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 6px 0 0;
    opacity: .85;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

input,
select,
textarea,
button {
    font: inherit;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
}

.search {
    flex: 1;
    min-width: 220px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
}

.primary {
    background: #126b3a;
    color: white;
}

.secondary {
    background: #e5e9e7;
}

.danger {
    background: #d9363e;
    color: white;
}

.club-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

.club-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.club-photo {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #e9eceb;
}

.no-photo {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9eceb;
    color: #777;
    font-size: 50px;
}

.card-body {
    padding: 16px;
}

.club-type {
    color: #126b3a;
    font-size: 25px;
    font-weight: 800;
}

.maker {
    color: #777;
    margin-top: 4px;
}

.name {
    font-size: 19px;
    font-weight: 700;
    margin: 5px 0 14px;
}

.distance {
    display: flex;
    gap: 8px;
}

.distance-box {
    flex: 1;
    background: #edf7f1;
    padding: 10px;
    border-radius: 10px;
}

.distance-box small {
    color: #777;
}

.distance-box strong {
    display: block;
    margin-top: 3px;
}

.specs {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.spec {
    background: #f5f6f6;
    padding: 8px;
    border-radius: 8px;
}

.spec small {
    display: block;
    color: #777;
    font-size: 11px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.actions button {
    flex: 1;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #777;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 10;
    overflow-y: auto;
    padding: 20px;
}

.modal-content {
    max-width: 700px;
    margin: 30px auto;
    background: white;
    border-radius: 18px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
}

.full {
    grid-column: 1 / -1;
}

.preview {
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    border-radius: 10px;
    margin-bottom: 10px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-actions button {
    flex: 1;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .modal {
        padding: 8px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 16px;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⛳ Golf Club Manager</h1>
    <p>ゴルフクラブ管理</p>
</header>

<div class="container">

    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 番手・メーカー・商品名を検索"
        >

        <button class="primary" onclick="openAddModal()">
            ＋ クラブを追加
        </button>
    </div>

    <div id="clubGrid" class="club-grid"></div>

</div>

<!-- 編集画面 -->
<div id="modal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">新しいクラブ</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>番手</label>
                <select id="clubType">
                    <option>1W</option>
                    <option>2W</option>
                    <option>3W</option>
                    <option>4W</option>
                    <option>5W</option>
                    <option>7W</option>
                    <option>9W</option>
                    <option>2U</option>
                    <option>3U</option>
                    <option>4U</option>
                    <option>5U</option>
                    <option>6U</option>
                    <option>1I</option>
                    <option>2I</option>
                    <option>3I</option>
                    <option>4I</option>
                    <option>5I</option>
                    <option>6I</option>
                    <option>7I</option>
                    <option>8I</option>
                    <option>9I</option>
                    <option>PW</option>
                    <option>AW</option>
                    <option>SW</option>
                    <option>LW</option>
                    <option>チッパー</option>
                    <option>パター</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>メーカー</label>
                <input id="maker" placeholder="例：TaylorMade">
            </div>

            <div class="form-group full">
                <label>商品名</label>
                <input id="name" placeholder="例：Qi35">
            </div>

            <div class="form-group">
                <label>総飛距離</label>
                <input id="distance" placeholder="例：230 yd">
            </div>

            <div class="form-group">
                <label>キャリー</label>
                <input id="carry" placeholder="例：210 yd">
            </div>

            <div class="form-group">
                <label>クラブ重量</label>
                <input id="clubWeight" placeholder="例：300 g">
            </div>

            <div class="form-group">
                <label>クラブ長さ</label>
                <input id="clubLength" placeholder="例：45.5 inch">
            </div>

            <div class="form-group">
                <label>ロフト角</label>
                <input id="loft" placeholder="例：10.5°">
            </div>

            <div class="form-group">
                <label>ライ角</label>
                <input id="lieAngle" placeholder="例：60°">
            </div>

            <div class="form-group">
                <label>バンス角</label>
                <input id="bounce" placeholder="例：10°">
            </div>

            <div class="form-group">
                <label>シャフト名</label>
                <input id="shaft" placeholder="例：VENTUS TR">
            </div>

            <div class="form-group">
                <label>フレックス</label>
                <select id="flex">
                    <option>R2</option>
                    <option>R</option>
                    <option>SR</option>
                    <option selected>S</option>
                    <option>SX</option>
                    <option>X</option>
                    <option>TX</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>シャフト重量</label>
                <input id="shaftWeight" placeholder="例：60 g">
            </div>

            <div class="form-group">
                <label>シャフト長さ</label>
                <input id="shaftLength" placeholder="例：44.0 inch">
            </div>

            <div class="form-group">
                <label>キックポイント</label>
                <select id="kickPoint">
                    <option>元調子</option>
                    <option>中元調子</option>
                    <option selected>中調子</option>
                    <option>先中調子</option>
                    <option>先調子</option>
                    <option>その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>グリップ交換日</label>
                <input id="gripDate" type="date">
            </div>

            <div class="form-group full">
                <label>クラブ写真</label>
                <input
                    id="photo"
                    type="file"
                    accept="image/*"
                >
                <img id="preview" class="preview" style="display:none;">
            </div>

            <div class="form-group full">
                <label>メモ</label>
                <textarea
                    id="memo"
                    rows="5"
                    placeholder="クラブについてのメモ"
                ></textarea>
            </div>

        </div>

        <div class="modal-actions">

            <button class="secondary" onclick="closeModal()">
                キャンセル
            </button>

            <button
                id="deleteButton"
                class="danger"
                onclick="deleteCurrentClub()"
                style="display:none;"
            >
                削除
            </button>

            <button class="primary" onclick="saveClub()">
                保存
            </button>

        </div>

    </div>
</div>

<script>

let clubs = [];
let editingId = null;
let currentPhoto = null;

const STORAGE_KEY = "golfClubManagerData";

/* =========================
   データ読み込み
========================= */

function loadData() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        try {
            clubs = JSON.parse(saved);
        } catch {
            clubs = [];
        }
    }

    renderClubs();
}


/* =========================
   データ保存
========================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(clubs)
    );
}


/* =========================
   一覧表示
========================= */

function renderClubs() {

    const grid = document.getElementById("clubGrid");

    const keyword =
        document.getElementById("search").value
        .toLowerCase();

    const filtered = clubs.filter(club => {

        const text = [
            club.clubType,
            club.maker,
            club.name,
            club.shaft
        ].join(" ").toLowerCase();

        return text.includes(keyword);
    });

    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                <div style="font-size:50px;">⛳</div>
                <h2>クラブがありません</h2>
                <p>「＋ クラブを追加」から登録できます。</p>
            </div>
        `;

        return;
    }

    grid.innerHTML = filtered.map(club => {

        const photo = club.photo
            ? `<img class="club-photo" src="${club.photo}">`
            : `<div class="no-photo">⛳</div>`;

        return `
            <div class="club-card">

                ${photo}

                <div class="card-body">

                    <div class="club-type">
                        ${escapeHTML(club.clubType || "未設定")}
                    </div>

                    <div class="maker">
                        ${escapeHTML(club.maker || "メーカー未入力")}
                    </div>

                    <div class="name">
                        ${escapeHTML(club.name || "商品名未入力")}
                    </div>

                    <div class="distance">

                        <div class="distance-box">
                            <small>総飛距離</small>
                            <strong>${escapeHTML(club.distance || "-")}</strong>
                        </div>

                        <div class="distance-box">
                            <small>キャリー</small>
                            <strong>${escapeHTML(club.carry || "-")}</strong>
                        </div>

                    </div>

                    <div class="specs">

                        ${spec("クラブ重量", club.clubWeight)}
                        ${spec("クラブ長さ", club.clubLength)}
                        ${spec("ロフト角", club.loft)}
                        ${spec("ライ角", club.lieAngle)}
                        ${spec("バンス角", club.bounce)}
                        ${spec("シャフト", club.shaft)}
                        ${spec("フレックス", club.flex)}
                        ${spec("シャフト重量", club.shaftWeight)}
                        ${spec("キックポイント", club.kickPoint)}
                        ${spec("グリップ交換日", club.gripDate)}

                    </div>

                    ${
                        club.memo
                        ? `<p style="margin-top:14px;">
                            ${escapeHTML(club.memo)}
                           </p>`
                        : ""
                    }

                    <div class="actions">

                        <button
                            class="primary"
                            onclick="openEditModal('${club.id}')"
                        >
                            ✏️ 編集
                        </button>

                        <button
                            class="danger"
                            onclick="deleteClub('${club.id}')"
                        >
                            🗑️ 削除
                        </button>

                    </div>

                </div>

            </div>
        `;

    }).join("");
}


function spec(title, value) {

    return `
        <div class="spec">
            <small>${title}</small>
            <strong>${escapeHTML(value || "-")}</strong>
        </div>
    `;
}


/* =========================
   追加
========================= */

function openAddModal() {

    editingId = null;
    currentPhoto = null;

    document.getElementById("modalTitle")
        .textContent = "新しいクラブ";

    document.getElementById("deleteButton")
        .style.display = "none";

    clearForm();

    document.getElementById("modal")
        .style.display = "block";
}


/* =========================
   編集
========================= */

function openEditModal(id) {

    const club = clubs.find(c => c.id === id);

    if (!club) return;

    editingId = id;
    currentPhoto = club.photo || null;

    document.getElementById("modalTitle")
        .textContent = "クラブを編集";

    document.getElementById("deleteButton")
        .style.display = "block";

    document.getElementById("clubType").value = club.clubType || "1W";
    document.getElementById("maker").value = club.maker || "";
    document.getElementById("name").value = club.name || "";
    document.getElementById("distance").value = club.distance || "";
    document.getElementById("carry").value = club.carry || "";
    document.getElementById("clubWeight").value = club.clubWeight || "";
    document.getElementById("clubLength").value = club.clubLength || "";
    document.getElementById("loft").value = club.loft || "";
    document.getElementById("lieAngle").value = club.lieAngle || "";
    document.getElementById("bounce").value = club.bounce || "";
    document.getElementById("shaft").value = club.shaft || "";
    document.getElementById("flex").value = club.flex || "S";
    document.getElementById("shaftWeight").value = club.shaftWeight || "";
    document.getElementById("shaftLength").value = club.shaftLength || "";
    document.getElementById("kickPoint").value = club.kickPoint || "中調子";
    document.getElementById("gripDate").value = club.gripDate || "";
    document.getElementById("memo").value = club.memo || "";

    const preview = document.getElementById("preview");

    if (currentPhoto) {
        preview.src = currentPhoto;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }

    document.getElementById("modal")
        .style.display = "block";
}


/* =========================
   フォーム初期化
========================= */

function clearForm() {

    document.getElementById("clubType").value = "1W";
    document.getElementById("maker").value = "";
    document.getElementById("name").value = "";
    document.getElementById("distance").value = "";
    document.getElementById("carry").value = "";
    document.getElementById("clubWeight").value = "";
    document.getElementById("clubLength").value = "";
    document.getElementById("loft").value = "";
    document.getElementById("lieAngle").value = "";
    document.getElementById("bounce").value = "";
    document.getElementById("shaft").value = "";
    document.getElementById("flex").value = "S";
    document.getElementById("shaftWeight").value = "";
    document.getElementById("shaftLength").value = "";
    document.getElementById("kickPoint").value = "中調子";
    document.getElementById("gripDate").value = "";
    document.getElementById("memo").value = "";
    document.getElementById("photo").value = "";

    document.getElementById("preview")
        .style.display = "none";
}


/* =========================
   保存
========================= */

function saveClub() {

    const data = {

        clubType: document.getElementById("clubType").value,

        maker: document.getElementById("maker").value,

        name: document.getElementById("name").value,

        distance: document.getElementById("distance").value,

        carry: document.getElementById("carry").value,

        clubWeight: document.getElementById("clubWeight").value,

        clubLength: document.getElementById("clubLength").value,

        loft: document.getElementById("loft").value,

        lieAngle: document.getElementById("lieAngle").value,

        bounce: document.getElementById("bounce").value,

        shaft: document.getElementById("shaft").value,

        flex: document.getElementById("flex").value,

        shaftWeight: document.getElementById("shaftWeight").value,

        shaftLength: document.getElementById("shaftLength").value,

        kickPoint: document.getElementById("kickPoint").value,

        gripDate: document.getElementById("gripDate").value,

        memo: document.getElementById("memo").value,

        photo: currentPhoto

    };


    if (editingId
